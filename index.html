<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategietag</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300767E'/%3E%3Cpath d='M17 46V32M32 46V18M47 46V26' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Ruhige Fläche, Glas-Leiste, Vertiefung in Sheets.
   Aufbau: vier Bereiche in der Leiste (Zahlen, Kunden, Themen, Ergebnis), je ein Bildschirm, eine Aufgabe.
   Oben rechts: Rückmeldung zum Tool, Parkplatz, Sichern, Einstellungen.
   Diagrammfarben (--dz-*): geprüfter Satz für hell und dunkel; Blau = Ertrag und was bleibt, Grau = Aufwand und Übriges. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73;
  --sep:rgba(60,60,67,.12); --fill:rgba(120,120,128,.10);
  --accent:#00767E; --accent-fill:#00767E; --brand:#008C95; --brand-soft:#E3F3F4;
  --idle:#C7C7CC; --alarm:#D70015; --warn:#B45309; --warn-soft:rgba(255,149,0,.15);
  --scrim:rgba(0,0,0,.24); --glass:rgba(245,245,247,.82); --pill:#FFFFFF;
  --dz-blau:#2a78d6; --dz-orange:#eb6834; --dz-aqua:#1baf7a; --dz-gelb:#eda100; --dz-grau:#8E8E93; --dz-grau2:#5E5E62; --dz-gelb-ink:#0b0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-modus="hell"]){
    --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#98989F;
    --sep:rgba(84,84,88,.48); --fill:rgba(120,120,128,.24);
    --accent:#5CCBD2; --accent-fill:#00767E; --brand:#2FB5BE; --brand-soft:#0E3436;
    --idle:#545458; --alarm:#FF6961; --warn:#FFB340; --warn-soft:rgba(255,159,10,.18);
    --scrim:rgba(0,0,0,.58); --glass:rgba(18,18,20,.80); --pill:#48484A;
    --dz-blau:#3987e5; --dz-orange:#d95926; --dz-aqua:#199e70; --dz-gelb:#c98500; --dz-gelb-ink:#ffffff;
    --shadow:0 0 0 1px rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-modus="hell"]), :root[data-modus="dunkel"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#98989F;
  --sep:rgba(84,84,88,.48); --fill:rgba(120,120,128,.24);
  --accent:#5CCBD2; --accent-fill:#00767E; --brand:#2FB5BE; --brand-soft:#0E3436;
  --idle:#545458; --alarm:#FF6961; --warn:#FFB340; --warn-soft:rgba(255,159,10,.18);
  --scrim:rgba(0,0,0,.58); --glass:rgba(18,18,20,.80); --pill:#48484A;
  --dz-blau:#3987e5; --dz-orange:#d95926; --dz-aqua:#199e70; --dz-gelb:#c98500; --dz-gelb-ink:#ffffff;
  --shadow:0 0 0 1px rgba(255,255,255,.05);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.gesperrt{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.klein{font-size:.8125rem}
.warn{color:var(--warn)}
.mitte{text-align:center}
.ic{width:1.2em;height:1.2em;flex:none}

/* ---------- Leiste ---------- */
.probe{display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem .9rem;background:var(--warn-soft);color:var(--warn);font-size:.8125rem;font-weight:600;text-align:center;padding:.35rem 1rem}
.probe button{font-weight:600;text-decoration:underline;text-underline-offset:.15em}
.probe.leise{background:var(--brand-soft);color:var(--ink);font-weight:500}
.probe .zu{text-decoration:none;font-size:1.1rem;line-height:1;padding:0 .35rem;color:var(--muted)}
.ohne-js{max-width:30rem;margin:18vh auto;padding:1.5rem;text-align:center;font-size:1.0625rem;line-height:1.5}
.vergleich{border-collapse:collapse;width:100%}
.vergleich th{text-align:left;font-weight:600;color:var(--muted);padding:.4rem .9rem .4rem 0;white-space:nowrap;vertical-align:top}
.vergleich td{padding:.4rem 0}
.vergleich tr + tr th,.vergleich tr + tr td{border-top:1px solid var(--sep)}
.kopf{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.kopf1{display:flex;align-items:center;gap:.6rem 1rem;max-width:84rem;margin:0 auto;padding:.6rem 1rem}
.marke{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.marke b{font-family:var(--display);font-size:1.0625rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marke span{color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf-r{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:.4rem}
.rundb{position:relative;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none}
.badge{position:absolute;top:-.2rem;right:-.2rem;min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:.6rem;background:var(--accent-fill);color:#fff;font-size:.6875rem;font-weight:700;font-style:normal;display:grid;place-items:center}
.pliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.pliste li{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem .5rem .5rem .9rem;border-radius:.9rem;background:var(--bg);font-weight:500;font-size:1.0625rem;overflow-wrap:anywhere}
.pliste li.leer{background:transparent;padding:.4rem 0;color:var(--muted);font-weight:400}
.pliste li.pk{display:block;padding:.3rem .5rem .3rem .75rem}
.pk-zeile{display:flex;align-items:flex-start;gap:.7rem}
.pk .stw-box{margin-top:.5rem}
.pk.an .stw-box{background:var(--accent-fill);box-shadow:none;color:#fff}
.pk-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;padding:.5rem 0;text-align:left;font-weight:500;font-size:1.0625rem;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.pk-t small{font-size:.875rem;font-weight:500;color:var(--muted)}
.pk.an .pk-t > span{color:var(--muted)}
.pk .n-gl{margin-top:.15rem}
.pk .stw-antw{background:var(--card);margin-bottom:.45rem}
.xk{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--fill);flex:none}
.xk .ic{width:1rem;height:1rem}
.seg{display:inline-flex;padding:.2rem;border-radius:.85rem;background:var(--fill)}
.seg button{height:2.15rem;padding:0 .9rem;border-radius:.65rem;font-weight:600;font-size:.9375rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.bereich button{height:2.4rem;padding:0 1.3rem;font-size:1rem}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:0 1.1rem;border-radius:1.375rem;font-weight:600;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn.stark{background:var(--accent-fill);color:#fff}
.btn.rot{color:var(--alarm)}
.btn.scharf{background:var(--alarm);color:#fff}
.btn.klein{min-height:2.5rem;padding:0 .9rem}
.punkt{position:absolute;top:.1rem;right:.1rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}

/* ---------- Bausteine ---------- */
main{max-width:84rem;margin:0 auto;padding:1.5rem 1rem 4rem}
@media (min-width:1800px){main,.kopf1{max-width:112rem}}   /* grosser Bildschirm (seit 0.9): mehr Breite, weniger Umbrüche */
.titel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem 1rem;margin-bottom:1rem}
.titel > div:first-child{flex:1;min-width:12rem}
.titel h1{font-size:2rem;line-height:1.1;font-weight:700;letter-spacing:-.022em}
.titel p{color:var(--muted);font-size:1.0625rem;margin-top:.3rem}
.titel-r{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.card{background:var(--card);border-radius:1.25rem;padding:1.15rem 1.25rem;box-shadow:var(--shadow)}
.leer{color:var(--muted);padding:.4rem 0}
.schnell{display:flex;gap:.45rem}
.schnell input,.dreier input{flex:1;min-width:0;height:3rem;padding:0 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);font-size:1.0625rem}
.rund{width:3rem;height:3rem;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center;flex:none}
.textlink{color:var(--muted);font-size:.875rem;text-decoration:underline;text-underline-offset:.15em;padding:.4rem 0}

/* ---------- Zahlen: Einfügen und Tabelle ---------- */
.ablage{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center;padding:2.2rem 1.25rem;max-width:44rem;margin:1rem auto;border:1.5px dashed var(--idle);box-shadow:none;background:transparent}
.ablage > .ic{width:2.2rem;height:2.2rem;color:var(--accent)}
.ablage h2{font-size:1.375rem;font-weight:700}
.ablage p{max-width:32rem}
.einfuegen{width:100%;max-width:26rem;min-height:3rem;padding:.75rem 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);resize:none;text-align:center;font-size:1rem}
body.drueber .ablage,body.drueber .tab-rahmen,body.drueber .dg{border-color:var(--brand);background:var(--brand-soft)}
.tab-rahmen{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);overflow:auto;max-height:max(18rem,calc(100vh - 16.5rem));border:1.5px solid transparent}
.zt{border-collapse:separate;border-spacing:0;width:100%;font-size:.9375rem}
.zt th,.zt td{padding:.42rem .9rem;white-space:nowrap;border-bottom:1px solid var(--sep)}
.zt thead th{position:sticky;top:0;z-index:2;background:var(--card);font-weight:600;color:var(--muted);text-align:right;font-size:.875rem;padding-top:.8rem;padding-bottom:.6rem}
.zt thead th.bez{left:0;z-index:3}
.zt thead th.bez,.zt tbody th{text-align:left}
.zt thead th button{font-weight:600;color:inherit;padding:.15rem .4rem;margin:-.15rem -.4rem;border-radius:.4rem}
.zt thead th button:hover{background:var(--fill)}
.zt td.bud{background:var(--fill)}
.zt thead th.bud{background:linear-gradient(var(--fill),var(--fill)) var(--card)}
.zt tbody th{position:sticky;left:0;background:var(--card);font-weight:400;max-width:22rem;overflow:hidden;text-overflow:ellipsis;z-index:1}
.zt td{text-align:right;font-variant-numeric:tabular-nums}
.zt .nr{color:var(--muted);font-size:.8125rem;margin-right:.5rem;font-variant-numeric:tabular-nums}
.zt tr.s1 th,.zt tr.s1 td{font-weight:600}
.zt tr.klick{cursor:pointer}
.zt .aufb{display:inline-flex;align-items:center;gap:.3rem;font-weight:inherit;max-width:100%}
.zt .aufb span{overflow:hidden;text-overflow:ellipsis}
.zt .aufb .ic{width:.95em;height:.95em;color:var(--muted);transition:transform .15s}
.zt tr.offen .aufb .ic{transform:rotate(90deg)}
.zt tr.kt th{padding-left:2.2rem;color:var(--muted)}
.zt tr.kt td{color:var(--muted)}
.zt.pf tbody th,.zt.pf thead th.bez{padding-left:2.2rem}
.zt.pf tr.klick th{padding-left:.75rem}
.zt.pf tr.kt th{padding-left:3.4rem}
.zt tr.s2 th,.zt tr.s2 td{font-weight:700;font-size:1.12em;border-top:1px solid var(--sep);background:var(--brand-soft)}
.zt tr.s3 th,.zt tr.s3 td{font-weight:700;font-size:1.25em;background:var(--brand-soft);color:var(--accent)}
/* viele Spalten: enger setzen, damit der Verlauf auf einen Bildschirm passt */
.zt.dicht{font-size:.8125rem}
.zt.dicht th,.zt.dicht td{padding-left:.45rem;padding-right:.45rem}
.zt.dicht thead th{white-space:normal;font-size:.75rem;vertical-align:bottom}
.zt.dicht tbody th{max-width:14rem}
.zt.dicht tr.s2 th,.zt.dicht tr.s2 td{font-size:1em}
.zt.dicht tr.s3 th,.zt.dicht tr.s3 td{font-size:1.1em}
.zt.dicht td:last-child,.zt.dicht thead th:last-child{padding-right:.9rem}
.zt tr.abg th,.zt tr.abg td{font-weight:600}
.zt tr.std th,.zt tr.std td{color:var(--muted)}
.zt tr.std.s1 th,.zt tr.std.s1 td{color:var(--ink)}
.zt .neg{color:var(--alarm)}
.zt tr:last-child th,.zt tr:last-child td{border-bottom:0}
.unter{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-top:.6rem}

/* ---------- Zahlen: Diagramme ---------- */
.c-blau{background:var(--dz-blau)} .c-orange{background:var(--dz-orange)} .c-aqua{background:var(--dz-aqua)} .c-gelb{background:var(--dz-gelb)} .c-grau{background:var(--dz-grau)} .c-grau2{background:var(--dz-grau2)}
.dgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(min(100%,30rem),calc(50% - .5rem)),1fr));gap:1rem}   /* höchstens zwei nebeneinander, auch am grossen Bildschirm */
.dg{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);padding:1.1rem 1.25rem 1rem;min-width:0;border:1.5px solid transparent}
.dg h2{font-size:1.1875rem;font-weight:700}
.dg-u{color:var(--muted);font-size:.9375rem;margin:.1rem 0 .7rem}
.dg-leg{display:flex;flex-wrap:wrap;gap:.25rem 1.1rem;font-size:.875rem;color:var(--muted)}
.dg-leg span{display:inline-flex;align-items:center;gap:.4rem}
.dg-leg i{width:.75rem;height:.75rem;border-radius:.2rem;flex:none}
.dg-leg i.halb{opacity:.45}
.dg-feld{padding:1.9rem 0 0 4.2rem}
.dg-innen{position:relative;height:13rem;border-bottom:1px solid var(--idle)}
.dg-g{position:absolute;left:0;right:0;border-top:1px solid var(--sep)}
.dg-t{position:absolute;left:-4.2rem;width:3.8rem;text-align:right;transform:translateY(50%);font-size:.75rem;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dg-baender{position:absolute;inset:0;display:flex}
.dg-band{flex:1;min-width:0;position:relative;border-radius:.5rem .5rem 0 0;outline-offset:-2px}
.dg-band:hover,.dg-band:focus-visible,.dg-seg i:hover,.dg-seg i:focus-visible{filter:brightness(1.08)}
.dg-band:hover,.dg-band:focus-visible{background:var(--fill)}
.dg-paar{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.dg-b{display:block;width:min(1.25rem,32%);min-height:1px;border-radius:.25rem .25rem 0 0}
.dg-st{display:flex;flex-direction:column-reverse;gap:2px;width:min(1.4rem,40%)}
.dg-st i{display:block;min-height:1px}
.dg-st i:last-child{border-radius:.25rem .25rem 0 0}
.dg-band.bud .dg-b,.dg-band.bud .dg-st{opacity:.45}
.dg-o{position:absolute;left:50%;transform:translateX(-50%);margin-bottom:.3rem;font-size:.8125rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dg-feld.eng .dg-o,.dg-feld.eng + .dg-n .dg-on{display:none}
.dg-x{display:flex;margin-top:.45rem}
.dg-x span{flex:1;min-width:0;text-align:center;font-size:.8125rem;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.dg-zeilen{display:flex;flex-direction:column;gap:.55rem;margin-top:.8rem}
.dg-z{display:flex;align-items:center;gap:.6rem}
.dg-zn{width:5.2rem;flex:none;font-size:.875rem;color:var(--muted);line-height:1.2}
.dg-seg{position:relative;flex:1;min-width:0;display:flex;gap:2px;height:1.75rem}
.dg-seg i{display:flex;align-items:center;min-width:0;border-radius:.25rem;font-style:normal;outline-offset:1px}
.dg-seg b{display:none;padding-left:.4rem;font-size:.875rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.dg-seg i.s9 b{display:block}
.dg-seg i.c-gelb b{color:var(--dz-gelb-ink)}
/* Marke bei 100 Franken: nur Striche über und unter dem Balken, damit sie keine Zahl durchkreuzt */
.dg-seg u{position:absolute;top:-.35rem;bottom:-.35rem;width:2px;margin-left:-1px;background:linear-gradient(var(--ink) 0 .3rem,transparent .3rem calc(100% - .3rem),var(--ink) calc(100% - .3rem) 100%)}
.dg-ende{width:5.6rem;flex:none;font-size:.875rem;font-weight:600;white-space:nowrap}
.dg-n{color:var(--muted);font-size:.8125rem;margin-top:.6rem}
.dg-leer{color:var(--muted);padding:1.2rem 0}
.dg-werte{margin-top:.7rem;border-top:1px solid var(--sep);padding-top:.5rem}
.dg-werte summary{cursor:pointer;color:var(--muted);font-size:.8125rem;font-weight:600;width:max-content;border-radius:.3rem}
.dg-wt{overflow-x:auto;margin-top:.4rem}
.dg-wt table{border-collapse:collapse;width:100%;font-size:.8125rem}
.dg-wt th,.dg-wt td{padding:.25rem .6rem .25rem 0;border-bottom:1px solid var(--sep);white-space:nowrap}
.dg-wt th{text-align:left;font-weight:600}
.dg-wt thead th{color:var(--muted)}
.dg-wt td,.dg-wt thead th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:70;left:0;top:0;max-width:18rem;padding:.5rem .7rem;border-radius:.7rem;background:var(--ink);color:var(--bg);font-size:.8125rem;line-height:1.35;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip strong{display:block;font-weight:700}
#tip[hidden]{display:none}

/* ---------- Themen ---------- */
.themen{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.5rem;align-items:start}
.tliste2{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:5rem;max-height:calc(100vh - 6rem);overflow-y:auto;scrollbar-width:thin;padding:.2rem;margin:-.2rem}
.tlink{display:flex;align-items:center;gap:.6rem;min-height:2.9rem;padding:.3rem .8rem .3rem .5rem;border-radius:.9rem;font-weight:600;color:var(--muted)}
.tlink .nr{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:.8125rem;font-weight:700;flex:none}
.tlink .tl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink .ok{color:var(--accent);width:1.1rem;height:1.1rem}
.tlink.on{background:var(--brand-soft);color:var(--accent)}
.tlink.on .nr{background:var(--accent-fill);color:#fff}
.tlink.neu{color:var(--accent);padding-left:.8rem}
.tz{display:contents}
.tlink.offen{color:var(--ink)}
.tlink .nr .ic{width:.95rem;height:.95rem}
.tlink .tl-z{min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:.65rem;background:var(--fill);font-size:.75rem;font-weight:700;display:grid;place-items:center;flex:none}
.tlink.kind{min-height:2.4rem;padding-left:1.15rem;font-weight:500;font-size:.9375rem}
.tlink.kind .nr{width:auto;min-width:1.9rem;height:auto;border-radius:0;background:none;display:block;font-size:.8125rem;font-weight:600}
.tlink.kind.on .nr{background:none;color:inherit}
.tlink.neu.leise{color:var(--muted);font-weight:500;min-height:2.4rem}
.pfad{display:inline-flex;align-items:center;gap:.2rem;color:var(--muted);font-weight:600;font-size:.9375rem;padding:.2rem 0;margin:0 0 .3rem -.2rem}
.pfad .ic{width:1.05rem;height:1.05rem}
.tnr{color:var(--muted);font-weight:600}
.uliste{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.4rem}
.urow{display:flex;align-items:center;gap:.7rem;min-height:3.1rem;padding:.4rem .7rem .4rem 1.1rem;border-radius:1rem;background:var(--card);box-shadow:var(--shadow)}
.urow .u-nr{color:var(--muted);font-weight:700;font-size:.875rem;min-width:2rem;flex:none}
.urow .u-t{flex:1;min-width:0;font-size:1.1875rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.urow .u-m{color:var(--muted);font-size:.875rem;white-space:nowrap}
.urow .ok{color:var(--accent);width:1.1rem;height:1.1rem;flex:none}
.urow .pf{color:var(--muted);width:1.1rem;height:1.1rem;flex:none}
.bst-rahmen{overflow-x:auto;background:var(--card);border-radius:1rem;box-shadow:var(--shadow);margin-bottom:.6rem}
.bst{width:100%;border-collapse:collapse;font-size:1.0625rem}
.bst th{text-align:left;font-size:.8125rem;font-weight:700;color:var(--muted);padding:.65rem 1rem .4rem;white-space:nowrap}
.bst td{padding:.5rem 1rem;border-top:1px solid var(--sep);vertical-align:top}
.bst tbody tr{cursor:pointer}
.bst td:first-child{font-weight:500}
.bst td button{font-weight:inherit;overflow-wrap:anywhere}
.bst .r{text-align:right}
.bst td small{display:block;color:var(--muted);font-size:.8125rem;font-weight:400}
.bl-zeile{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.4rem 1rem;margin:1.5rem 0 .55rem}
.bl-zeile .bl{margin:0}
.seg.klein button{height:1.9rem;padding:0 .8rem;font-size:.8125rem}
/* Baustellen (seit 0.9): je Bauführer oder Polier eine Karte, eine Zeile je Baustelle, der andere in einer eigenen grauen Spalte.
   Die Karten füllen Spalten von oben nach unten: am Laptop eine, am grossen Bildschirm zwei, ohne Lücken. */
.bgr{columns:40rem;column-gap:1.1rem;margin-bottom:.2rem}
.bg{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;display:block;width:100%;margin:0 0 1rem;background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:.7rem 1.15rem .3rem;min-width:0}
.bg header{display:grid;grid-template-columns:minmax(0,1fr) 13rem;align-items:baseline;column-gap:1rem;padding-bottom:.45rem;border-bottom:1px solid var(--sep)}
.bg header b{font-family:var(--display);font-size:1.1875rem;font-weight:700;overflow-wrap:anywhere}
.bg header .bg-k{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;color:var(--muted);font-size:.8125rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.bg header .zahl{color:var(--muted);font-weight:700;font-size:.9375rem;text-transform:none;letter-spacing:0}
.bg li + li{border-top:1px solid var(--sep)}
.bg li button{display:grid;grid-template-columns:minmax(0,1fr) 13rem;align-items:baseline;column-gap:1rem;width:100%;padding:.5rem 0;text-align:left;font-size:1.0625rem;font-weight:500;line-height:1.3}
.bg-n{min-width:0;overflow-wrap:anywhere}
.bg-mit{color:var(--muted);font-size:.875rem;font-weight:400;margin-left:.45rem;white-space:nowrap}
.bg-d{min-width:0;color:var(--muted);font-size:.9375rem;font-weight:400;overflow-wrap:anywhere}
.bst-neu{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem 1.2rem;margin:.1rem 0 .4rem}
.bst-neu .textlink{text-decoration:none;color:var(--accent);font-size:.9375rem;font-weight:600;display:inline-flex;align-items:center;gap:.35rem}
.bst-neu .textlink .ic{width:1rem;height:1rem}
.bst-form{margin-bottom:.35rem}
.thema.zu .bst-neu{display:none}

/* Felder seit 0.9: ein Knopf «Feld hinzufügen», Tabelle und Gruppen */
.fd-neu .muted{align-self:center}
.fd-arten{display:flex;flex-direction:column;gap:.5rem}
.fd-art{display:flex;align-items:center;gap:.9rem;width:100%;padding:.85rem 1rem;border-radius:1rem;background:var(--bg);text-align:left;color:var(--ink)}
.fd-art:hover{background:var(--fill)}
.fd-art-ic{flex:none;width:2.4rem;height:2.4rem;border-radius:.75rem;display:grid;place-items:center;background:var(--brand-soft);color:var(--accent)}
.fd-art-ic .ic{width:1.3rem;height:1.3rem}
.fd-art-t{flex:1;min-width:0}
.fd-art b{display:block;font-size:1.0625rem}
.fd-art small{display:block;color:var(--muted);font-size:.875rem;line-height:1.3;margin-top:.1rem}
.fd-art .pf{flex:none;color:var(--muted);width:1rem;height:1rem}
.fd-tab-rahmen{overflow-x:auto;background:var(--card);border-radius:1rem;box-shadow:var(--shadow);margin:0 0 .5rem}
.fd-tab{width:100%;border-collapse:collapse;font-size:1.0625rem}
.fd-tab th{text-align:left;font-size:.8125rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:.75rem 1rem .45rem;white-space:nowrap}
.fd-tab td{padding:.6rem 1rem;border-top:1px solid var(--sep);vertical-align:baseline;overflow-wrap:anywhere}
.fd-tab td:first-child button{font:inherit;font-weight:600;text-align:left;color:inherit;padding:0;overflow-wrap:anywhere}
.fd-tab tbody tr{cursor:pointer}
.fd-tab tbody tr:hover td{background:var(--fill)}
.fd-tab .r{text-align:right}
.fd-tab tfoot td{font-weight:700;border-top:1.5px solid var(--sep)}
.fd-tab tr.ein-vor td{box-shadow:inset 0 3px 0 var(--brand)}
.fd-tab tr.ein-nach td{box-shadow:inset 0 -3px 0 var(--brand)}
.fd-tab tr.ein-vor::before,.fd-tab tr.ein-nach::after{content:none}
.fd-tab-neu{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr)) auto;gap:.45rem;margin-bottom:.4rem}
.fd-tab-neu input{min-width:0;height:3rem;padding:0 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);font-size:1.0625rem}
.fdg-brett{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.8rem;align-items:start;margin:0 0 .5rem}
.fdg-sp{background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:.7rem;display:flex;flex-direction:column;gap:.45rem;min-height:7.5rem;border:1.5px solid transparent;min-width:0}
.fdg-sp.ziel{border-color:var(--brand);background:var(--brand-soft)}
.fdg-k{display:block;width:100%;text-align:left;padding:.55rem .75rem;border-radius:.75rem;background:var(--bg);font-weight:500;font-size:1.0625rem;line-height:1.25;overflow-wrap:anywhere;color:var(--ink)}
.fdg-neu input{width:100%;height:2.6rem;padding:0 .8rem;border-radius:.75rem;border:1px solid var(--sep);background:transparent;font-size:1rem;color:var(--ink)}
.zu .fd-neu,.zu .fd-tab-neu,.zu .fdg-neu{display:none}
.e-fdg{list-style:none;padding-left:0}
.e-fdg li{margin:.15rem 0}
.e-fdtab .r{text-align:right}
.e-fdtab tfoot td{font-weight:700}
/* Reiter «GL» seit 0.9: Gruppen, Haken «gesagt», Ergebnis */
.gl-brett{display:flex;flex-direction:column;gap:1.1rem;margin-bottom:1.3rem}
.gl-gr{border-radius:1.3rem;border:1.5px solid transparent;margin:-.45rem;padding:.45rem}
.gl-gr.ziel{border-color:var(--brand);background:var(--brand-soft)}
.gl-kopf{display:flex;align-items:center;gap:.6rem;margin:0 .1rem .5rem}
.gl-kopf button{display:flex;align-items:center;gap:.5rem;min-width:0;color:inherit}
.gl-kopf .bl{margin:0}
.gl-kopf .ic{width:.9rem;height:.9rem;color:var(--muted)}
.gl-kopf .fd-info{margin-left:auto}
.gl-karte{background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:0 1rem}
.gl-liste{list-style:none;margin:0;padding:0}
.gl-liste:empty{display:none}
.gl-liste + .gl-neu{border-top:1px solid var(--sep)}
.gl-neu{display:flex;align-items:center;gap:.7rem}
.gl-neu button{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.gl-neu button .ic{width:1.15rem;height:1.15rem}
.gl-neu input{flex:1;min-width:0;height:3rem;padding:0;border:0;background:transparent;font-size:1.0625rem;outline:none;color:var(--ink)}
.gl-neu input::placeholder{color:var(--muted)}
.glp{display:flex;align-items:center;gap:.75rem;padding:.15rem 0;position:relative}
.glp + .glp{border-top:1px solid var(--sep)}
.glp.ein-vor::before{top:-2px}
.glp.ein-nach::after{bottom:-2px}
.glp.geist{padding:.15rem .9rem;border-radius:1rem}
.glp-box{flex:none;width:1.9rem;height:1.9rem;display:grid;place-items:center;border-radius:.6rem;box-shadow:inset 0 0 0 1.5px var(--idle);color:transparent}
.glp-box .ic{width:1.1rem;height:1.1rem}
.glp.an .glp-box{background:var(--accent-fill);box-shadow:none;color:#fff}
.glp.an .glp-t{color:var(--muted)}
.glp .n-text{display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;text-align:left}
.glp-e{font-size:.9375rem;font-weight:500;color:var(--accent);line-height:1.3}
.glp-e::before{content:"→ "}
/* Ziehen seit 0.9 auch mit dem Finger: kurz drücken hebt den Eintrag an */
.hebt{transform:scale(1.03);box-shadow:0 10px 28px rgba(0,0,0,.22)!important;transition:transform .12s ease,box-shadow .12s ease;position:relative;z-index:3}
.finger [data-zieh],.finger .karte,.finger .tliste2 .tlink[data-id]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tlink.geist{width:auto;opacity:.95}
.fd-geist{padding:.6rem 1rem;border-radius:.9rem;font-weight:600;max-width:24rem}

/* Seit 1.0: Jahr und «Eine Seite» im Ergebnis, Rückblick mit Beschlüssen vom letzten Jahr, GL mit Herkunft, Mitschrift und Vorjahren */
.e-wahl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem;max-width:52rem;margin:0 auto .9rem}
.e-archiv-hinweis{max-width:52rem;margin-left:auto!important;margin-right:auto!important}
.e-wahl:empty{display:none}
.e-archiv-hinweis{display:flex;align-items:center;gap:.4rem;margin:-.3rem 0 .7rem}
.e-zwei{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(15rem,1fr);gap:0 1.6rem;align-items:start}
.e-zwei .e-tab th,.e-zwei .e-tab td{padding-left:.5rem;padding-right:.5rem}
.e-mehr{color:var(--muted);font-style:italic;list-style:none}
.e-grau{color:var(--muted)}
.blatt.eine-seite{max-width:52rem}
.bvj-m{display:block;color:var(--muted);font-size:.875rem;font-weight:400;margin-top:.15rem}
.z-th.st-chip{background:var(--brand-soft);color:var(--accent)}
.gvj .glp-e{display:block;margin-top:.25rem}
.glp-weg{display:block;font-size:.8125rem;font-weight:500;color:var(--warn);margin-top:.15rem}
.gl-mit{display:block;width:100%;text-align:left;margin-top:.55rem;padding:.7rem 1rem;border-radius:1rem;background:var(--fill);color:var(--ink)}
.gl-mit-k{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.2rem}
.gl-mit-t{display:block;white-space:pre-wrap;line-height:1.4}
.gl-mit-neu{margin:.45rem .2rem 0;font-size:.875rem;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:.35rem}
.gl-mit-neu .ic{width:.9rem;height:.9rem}
.gl-vj{margin:0 0 1.2rem;border-radius:1rem;background:var(--card);box-shadow:var(--shadow);padding:.2rem 1rem}
.gl-vj summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.45rem;padding:.75rem 0;font-weight:600}
.gl-vj summary::-webkit-details-marker{display:none}
.gl-vj summary .pf{width:.95rem;height:.95rem;color:var(--muted);transition:transform .15s}
.gl-vj[open] summary .pf{transform:rotate(90deg)}
.gl-vj section{border-top:1px solid var(--sep);padding:.6rem 0 .8rem}
.gl-vj h3{font-size:1.0625rem;margin:.2rem 0 .3rem}
.gl-vj h4{font-size:.8125rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:.6rem 0 .2rem}
.gl-vj ul{margin:0;padding-left:1.1rem}
.gl-vj li{margin:.15rem 0}
.gl-vj .glp-e{display:inline}
.gp-q{margin:.2rem 0 .3rem;font-weight:500}
.nj-liste{margin:.4rem 0 .8rem;padding-left:1.1rem}
.nj-liste li{margin:.35rem 0;line-height:1.4}
@media (max-width:52rem){.e-zwei{grid-template-columns:1fr}}

/* ---------- Kunden: Offerten und Aufträge ---------- */
.wahl{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.9375rem;color:var(--muted)}
.wahl select{height:2.55rem;padding:0 .8rem;border-radius:.85rem;border:0;background:var(--fill);font-weight:600;color:var(--ink)}
.rg{display:flex;flex-direction:column;gap:.5rem;margin:.2rem 0 .3rem}
.rg-z{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 5.4rem;align-items:center;gap:.7rem;border-radius:.4rem;outline-offset:2px}
.rg-n{font-size:.9375rem;font-weight:500;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-b{display:block;height:1.35rem;border-radius:.25rem;background:var(--fill);overflow:hidden}
.rg-b i{display:block;height:100%;min-width:2px;border-radius:.25rem}
.rg-w{display:flex;align-items:baseline;justify-content:flex-end;gap:.4rem;white-space:nowrap}
.rg-w b{font-size:1rem;font-weight:700}
.rg-w small{color:var(--muted);font-size:.75rem}
.k-off{max-width:38rem}
.bst.at td{font-size:.9375rem}
.bst.at td:first-child{font-weight:400;color:var(--muted)}
.bst.at td:nth-child(2){font-weight:500;font-size:1.0625rem;min-width:13rem}
.zwei.js{grid-template-columns:6.5rem minmax(0,1fr)}
.glseite{max-width:58rem}
.thema .titel{margin-bottom:.7rem}
.thema .titel h1{font-size:2.25rem}
.frage{font-size:1.1875rem;line-height:1.35;color:var(--muted);max-width:54rem;margin-bottom:.4rem}
.bl{font-size:.8125rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:1.5rem 0 .55rem}
.eintraege{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.6rem}
.eintraege:empty{display:none}
.stw{background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:.15rem 1.1rem;margin-bottom:.6rem}
.stw li{position:relative}
.stw li + li{border-top:1px solid var(--sep)}
.stw li .stw-t{display:flex;align-items:flex-start;gap:.8rem;flex:1;min-width:0;padding:.62rem 0;text-align:left;font-size:1.1875rem;line-height:1.35;font-weight:500}
.stw li .stw-t::before{content:"";flex:none;width:.42rem;height:.42rem;margin-top:.5em;border-radius:50%;background:var(--brand)}
.stw li .stw-t span{min-width:0;overflow-wrap:anywhere}
.stw li .stw-t::before{display:none}
.stw-zeile{display:flex;align-items:flex-start;gap:.7rem}
.stw-box{flex:none;width:1.6rem;height:1.6rem;margin-top:.62rem;display:grid;place-items:center;border-radius:.5rem;box-shadow:inset 0 0 0 1.5px var(--idle);color:transparent}
.stw-box .ic{width:1rem;height:1rem}
.stw-z.an .stw-box{background:var(--accent-fill);box-shadow:none;color:#fff}
.stw-z.an .stw-t{color:var(--muted)}
.stw-antw,.glp-antw{display:block;width:calc(100% - 2.3rem);margin:-.1rem 0 .6rem 2.3rem;height:2.5rem;padding:0 .85rem;border-radius:.85rem;border:0;background:var(--fill);font-size:1rem;color:var(--ink);outline:none}
.glp{flex-wrap:wrap}
.glp-antw{flex:1 1 100%;width:auto;margin:0 0 .5rem 2.65rem}
.glp-m{font-size:.875rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.1rem 0 .7rem}
.chip{height:2.2rem;padding:0 .8rem;border-radius:1.1rem;background:var(--fill);color:var(--ink);font-size:.875rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-fill);color:#fff}
.n-up .ic{width:.95rem;height:.95rem}
button.b-ic.abh{background:transparent;box-shadow:inset 0 0 0 1.5px var(--idle);color:transparent}
button.b-ic.abh[aria-pressed="true"]{background:var(--accent-fill);box-shadow:none;color:#fff}
.besch.erl .b-was{color:var(--muted);text-decoration:line-through}
.letzt{margin:.2rem 0 .3rem}
.letzt summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9375rem;padding:.25rem 0}
.letzt ul{list-style:none;margin:0;padding:.25rem 0 0}
.letzt li{padding:.25rem 0;font-size:1rem;line-height:1.35}
.l-st{display:inline-block;width:1.1rem;color:var(--accent);font-weight:700}
.l-m{color:var(--muted);font-size:.875rem}
.gp-auftrag{margin:.2rem 0 .6rem}
.gp-auftrag summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9375rem;padding:.3rem 0}
.stw ul + .stw-neu{border-top:1px solid var(--sep)}
.stw-neu{display:flex;align-items:center;gap:.7rem}
.stw-neu button{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.stw-neu button .ic{width:1.15rem;height:1.15rem}
.stw-neu input{flex:1;min-width:0;height:2.9rem;padding:0;border:0;background:transparent;font-size:1.0625rem;outline:none}
.stw-neu input::placeholder{color:var(--muted)}
.stw li.ein-vor::before{top:-2px}
.stw li.ein-nach::after{bottom:-2px}
.stw.geist{padding:.15rem 1.1rem;min-width:12rem}
.notiz,.besch,.rz{display:flex;align-items:center;gap:.5rem;background:var(--card);border-radius:1rem;box-shadow:var(--shadow);padding:.35rem .5rem .35rem 1.1rem}
.notiz.gl,.besch.gl{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.n-text{flex:1;min-width:0;padding:.55rem 0;font-size:1.1875rem;line-height:1.3;font-weight:500;overflow-wrap:anywhere}
.n-gl{display:inline-flex;align-items:center;gap:.3rem;height:2.3rem;padding:0 .75rem;border-radius:1.15rem;color:var(--muted);font-weight:700;font-size:.8125rem;flex:none}
.n-gl[aria-pressed="true"]{background:var(--accent-fill);color:#fff}
.besch{padding-left:.7rem;gap:.7rem}
.b-ic{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center;flex:none}
.b-ic .ic{width:1rem;height:1rem;stroke-width:2.5}
.b-text{flex:1;min-width:0;padding:.5rem 0;display:flex;flex-direction:column;gap:.05rem}
.b-was{font-size:1.1875rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.b-meta{color:var(--muted);font-size:.9375rem}
.dreier{display:grid;grid-template-columns:minmax(0,1fr) 10rem 10rem auto;gap:.45rem}
.dreier.mit-th{grid-template-columns:12rem minmax(0,1fr) 9rem 9rem auto}
.th-wahl{height:3rem;min-width:0;padding:0 .8rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);font-size:1rem;font-weight:500}
.schnell .th-wahl{flex:0 0 12rem}
.fd{margin-bottom:.4rem}
.fd-kopf{display:flex;align-items:baseline;gap:.6rem;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.fd-kopf svg{width:.9rem;height:.9rem;color:var(--muted);margin-left:auto;align-self:center}
.fd-info{color:var(--muted);font-size:.8125rem;font-weight:600}
.fd-liste{list-style:none;margin:0 0 .5rem;padding:0;display:flex;flex-direction:column;gap:.4rem}
.fd-p{width:100%;display:flex;align-items:center;gap:.75rem;min-height:3rem;padding:.6rem 1rem;border-radius:1rem;border:0;background:var(--card);box-shadow:var(--shadow);font-size:1.0625rem;text-align:left;color:var(--ink);cursor:pointer}
.fd-box{flex:none;display:grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:.45rem;box-shadow:inset 0 0 0 1.5px var(--sep);color:transparent}
.fd-box svg{width:.95rem;height:.95rem}
.fd.fd-wahl .fd-box{border-radius:50%}
.fd-p.an .fd-box{background:var(--accent);box-shadow:none;color:#fff}
.fd-p.an .fd-t{color:var(--muted)}
.fd.fd-wahl .fd-p.an{box-shadow:inset 0 0 0 2px var(--accent)}
.fd.fd-wahl .fd-p.an .fd-t{color:var(--ink);font-weight:600}
.fd-neu{gap:.45rem;margin:.2rem 0 1.4rem}
.zu .fd-neu{display:none}
.e-fd{list-style:none;padding-left:0}
.vr-z{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:.4rem}
.rm-nach{background:var(--warn-soft);border-radius:1rem;padding:.7rem .9rem;margin:.6rem 0}
.rm-nach h3{margin-top:0}
.rm-bild{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:-.2rem 0 .8rem}
.rm-vorschau{position:relative;display:inline-block}
.rm-vorschau img{display:block;max-width:14rem;max-height:9rem;border-radius:.7rem;box-shadow:inset 0 0 0 1px var(--sep)}
.rm-vorschau .xk{position:absolute;top:.3rem;right:.3rem;background:var(--card)}
.rm-mini{display:flex;align-items:center;gap:.6rem;margin-top:.35rem}
.rm-mini img{width:4.5rem;height:3rem;object-fit:cover;border-radius:.45rem;box-shadow:inset 0 0 0 1px var(--sep)}
.k-sort{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap;text-align:inherit}
.k-sort.an{color:var(--accent)}
.k-such{margin:.1rem 0 .55rem}
.k-such input{width:100%;height:2.75rem;padding:0 1rem;border-radius:.9rem;border:1px solid var(--sep);background:var(--card);font-size:1rem;color:var(--ink)}
.pr-sub{margin:.85rem 0 .35rem;font-size:.8125rem;font-weight:600;color:var(--muted)}
.pr-gr .pr-sub:first-of-type{margin-top:.2rem}
.z-th{display:inline-block;margin-right:.45rem;padding:.05rem .5rem;border-radius:.45rem;background:var(--fill);color:var(--muted);font-size:.8125rem;font-weight:600;vertical-align:.08em}
.rz{flex-wrap:wrap;gap:.3rem .8rem;padding:.4rem .6rem .4rem 1.1rem}
.rz .n-text{min-width:12rem}
.rz .seg button{height:2.1rem;padding:0 .8rem;font-size:.875rem}
.rz .seg button.st-erreicht[aria-pressed="true"]{background:var(--accent-fill);color:#fff}
.rz .seg button.st-teilweise[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.hilfe{display:flex;align-items:center;gap:.4rem;margin-top:1.2rem}

/* Tafel für die Gruppenzuteilung */
.tafel{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:.8rem;align-items:start;margin-top:1rem}
.spalte{background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:.7rem;display:flex;flex-direction:column;gap:.45rem;min-height:9.5rem;border:1.5px solid transparent}
.spalte.pool{background:transparent;box-shadow:none;border:1.5px dashed var(--idle)}
.spalte.ziel{border-color:var(--brand);border-style:solid;background:var(--brand-soft)}
.sp-kopf{display:flex;align-items:center;justify-content:space-between;gap:.4rem;font-weight:700;padding:.1rem .25rem .25rem}
.sp-kopf button{font-weight:700;border-radius:.4rem;padding:.1rem .35rem;margin:-.1rem -.35rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sp-kopf button:hover{background:var(--fill)}
.sp-kopf .zahl{color:var(--muted);font-weight:600;font-size:.875rem}
.karte{display:flex;align-items:center;text-align:left;min-height:var(--kh,0);width:100%;padding:.55rem .75rem;border-radius:.75rem;background:var(--bg);font-weight:500;font-size:1.0625rem;line-height:1.25;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-wrap:anywhere}
.spalte.pool .karte{background:var(--card);box-shadow:var(--shadow)}
.zieht{opacity:.3}
.ein-vor,.ein-nach{position:relative}
.ein-vor::before,.ein-nach::after{content:"";position:absolute;left:.3rem;right:.3rem;height:3px;border-radius:2px;background:var(--brand);pointer-events:none;z-index:1}
.ein-vor::before{top:-.38rem}
.ein-nach::after{bottom:-.38rem}
.bg li.ein-vor::before{top:-2px}
.bg li.ein-nach::after{bottom:-2px}
.bg.geist{padding:.2rem 1rem;min-width:12rem}
.geist{position:fixed;z-index:80;left:0;top:0;pointer-events:none;background:var(--card);box-shadow:0 12px 32px rgba(0,0,0,.28);rotate:-2deg}
body.am-ziehen,body.am-ziehen .karte{cursor:grabbing}
body.am-ziehen{user-select:none;-webkit-user-select:none}
.sp-leer{color:var(--muted);font-size:.875rem;line-height:1.3;padding:.3rem .25rem}
.sp-neu input{width:100%;height:2.6rem;padding:0 .8rem;border-radius:.75rem;border:1px solid var(--sep);background:var(--card);font-size:1rem}
.tafel-unten{margin-top:.3rem;justify-content:space-between}
.tafel.fest .karte{cursor:default}
.karte{flex-direction:column;align-items:flex-start;justify-content:center;gap:.1rem}
.karte small{display:block;color:var(--muted);font-size:.8125rem;font-weight:400;line-height:1.2}
.sp-hinweis{margin:-.25rem .25rem .1rem;color:var(--warn);font-size:.8125rem;font-weight:600}
.tafel-unten > .reihe{gap:.2rem 1rem}
/* Mitarbeiterliste: Bestand, Ein- und Austritte, Liste im Sheet */
.ma-leer{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.ma-leer p{color:var(--muted)}
.ew-art{flex:none;min-width:4.6rem;text-align:center;font-size:.75rem;font-weight:700;padding:.2rem .55rem;border-radius:.6rem;background:var(--fill);color:var(--muted)}
.ew-art.ein{background:var(--brand-soft);color:var(--accent)}
.ew-art.aus,.ew-art.pension{background:var(--warn-soft);color:var(--warn)}
.rz.ew{padding-left:.8rem}
.pr-zwei{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:0 1.25rem;align-items:start}
.pr-gr{min-width:0}
.pr-gr .bl-zeile{min-height:2.5rem}
.pr-liste{list-style:none;margin:0 0 .6rem;padding:0 1rem;background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow)}
.pr-liste li + li{border-top:1px solid var(--sep)}
.pr-liste button{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "p a";column-gap:.8rem;row-gap:.05rem;width:100%;padding:.5rem 0;text-align:left}
.pr-n{grid-area:n;font-size:1.0625rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.pr-p{grid-area:p;color:var(--muted);font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}
.pr-a{grid-area:a;align-self:center;font-size:.8125rem;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap}
.pr-a.pen{color:var(--warn)}
.ew-liste{gap:0;background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);padding:0 1rem}
.ew-liste .rz{background:none;box-shadow:none;border-radius:0;padding:.1rem 0}
.ew-liste .rz + .rz{border-top:1px solid var(--sep)}
.ew-liste .b-was{font-size:1.0625rem}
.ew-liste .b-text{padding:.45rem 0}
.ma-liste{display:flex;flex-direction:column;background:var(--card);border-radius:1rem;box-shadow:var(--shadow);margin-bottom:.4rem}
.ma-liste li + li{border-top:1px solid var(--sep)}
.ma-z{display:flex;align-items:center;gap:.7rem;width:100%;min-height:3rem;padding:.45rem .8rem .45rem 1rem;text-align:left}
.ma-z .ma-n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ma-z .ma-m{flex:1;min-width:0;color:var(--muted);font-size:.875rem;text-align:right}
.ma-z .pf{width:1rem;height:1rem;color:var(--muted);flex:none}
.ma-weg summary{cursor:pointer;color:var(--muted);font-weight:600;padding:.6rem 0}
.sheet-inhalt > .bl:first-of-type{margin-top:.6rem}
.f[hidden]{display:none}
/* Anhänge: Kacheln unter der Frage, Ansicht fast bildschirmfüllend */
.anh-reihe{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.8rem;margin:1rem 0 .3rem}
.anh{display:flex;flex-direction:column;background:var(--card);border-radius:1.1rem;box-shadow:var(--shadow);overflow:hidden;text-align:left;min-width:0}
.anh:hover{box-shadow:var(--shadow),0 0 0 1.5px var(--brand)}
.anh-bild{height:9rem;background:var(--fill);display:flex;align-items:center;justify-content:center;overflow:hidden}
.anh-bild img{width:100%;height:100%;object-fit:cover}
.anh-bild .ic{width:2.4rem;height:2.4rem;color:var(--muted)}
.anh-name{display:block;padding:.55rem .8rem .6rem;font-weight:600;font-size:.9375rem;line-height:1.25;overflow-wrap:anywhere}
.anh-name small{display:block;color:var(--muted);font-weight:400;font-size:.8125rem;margin-top:.1rem}
.sheet-huelle.voll{align-items:center;padding:.6rem}
.sheet.anh-sheet{width:min(100%,100rem);max-width:none;height:100%;max-height:none;border-radius:1.25rem}
.anh-sheet > header{grid-template-columns:auto minmax(0,1fr) auto}
.anh-sheet > header h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anh-sheet .rechts{justify-self:end;gap:.2rem;flex-wrap:nowrap}
.tbtn.rot{color:var(--alarm)}
.anh-voll{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:.6rem;border-radius:0 0 1.25rem 1.25rem}
.anh-voll img{max-width:100%;max-height:100%;object-fit:contain;border-radius:.4rem}
.anh-voll iframe{width:100%;height:100%;border:0;border-radius:.6rem;background:#fff}
.anh-voll p{text-align:center;max-width:26rem}
.anh-sheet:fullscreen{width:100vw;height:100vh;border-radius:0}
.anh-sheet:fullscreen .anh-voll{border-radius:0}
.e-gruppen{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem;margin-top:.4rem}
.e-gruppen .e-gr{border:1px solid var(--sep);border-radius:.8rem;padding:.5rem .75rem .45rem;break-inside:avoid}
.e-gruppen .e-gr h3{font-size:1rem;font-weight:700;margin:0 0 .25rem}
.e-gruppen .e-gr h3 span{color:var(--muted);font-weight:500}
.e-gruppen .e-gr ol{list-style:none;margin:0;padding:0}
.e-gruppen .e-gr li{padding:.2rem 0;border-top:1px solid var(--sep);font-size:.9375rem}
.e-gruppen .e-gr li:first-child{border-top:0}
.e-bst{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.e-pers td{padding-top:.3rem;padding-bottom:.3rem}
.e-pers td:first-child{width:50%}
.k-erh{display:inline-block;min-width:3.4rem;text-align:center;font-size:.75rem;font-weight:700;padding:.15rem .5rem;border-radius:.55rem;background:var(--fill);color:var(--muted)}
.k-erh.ja{background:var(--brand-soft);color:var(--accent)}
.k-erh.offen{background:var(--warn-soft);color:var(--warn)}
.bst tr.aus-liste td small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
.festband{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .8rem;margin-top:1rem;padding:.55rem .6rem .55rem .9rem;border-radius:1rem;background:var(--brand-soft);font-weight:600}
.festband .ic{color:var(--accent)}
.festband > span{flex:1;min-width:10rem}
.festband .btn{background:var(--card)}
.thema.zu form,.thema.zu .tafel-unten .textlink{display:none}
.thema.zu [data-zieh],.thema.zu .karte{cursor:default}
.zu-band{margin:0 0 .4rem}
.abschl .ic{stroke-width:2.5}
@media (max-width:600px){.abschl{width:2.5rem;padding:0;justify-content:center;border-radius:50%}.abschl span{display:none}}
/* Personal und offene Ziele: Zeilen wie beim Rückblick, rechts der Stand */
.rz .b-text{min-width:12rem}
.rz.gl{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.rz .seg button.st-besetzt[aria-pressed="true"],.rz .seg button.st-ja[aria-pressed="true"]{background:var(--accent-fill);color:#fff}
.rz .seg button.st-laeuft[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.oz-st{display:block;font-size:.8125rem;font-weight:700;color:var(--muted)}
.oz-st.teilweise{color:var(--warn)}
.f > .seg{display:flex;flex-wrap:wrap}
.f > .seg button{flex:1 1 auto}
/* Ausblick aufs Folgejahr */
.ausblick{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);padding:1.1rem 1.25rem 1.1rem;margin-top:1rem}
.ab-kopf{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.5rem 1rem}
.ab-kopf h2{font-size:1.1875rem;font-weight:700}
.ab-kopf p{color:var(--muted);font-size:.9375rem;margin-top:.1rem}
.ab-zahlen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem 1.2rem;margin:1rem 0 .8rem}
.ab-zahlen > div{min-width:0}
.ab-zahlen span{display:block;color:var(--muted);font-size:.8125rem;font-weight:600}
.ab-zahlen b{display:block;font-family:var(--display);font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.ab-zahlen small{color:var(--muted);font-size:.8125rem}
.ab-balken{height:.85rem;border-radius:.45rem;background:var(--fill);overflow:hidden}
.ab-balken i{display:block;height:100%;background:var(--accent-fill);border-radius:.45rem}
.ab-balken{display:flex}
.ab-balken i{flex:none;border-radius:0}
.ab-balken i.of{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.ab-zahlen.vier{grid-template-columns:repeat(4,minmax(0,1fr))}
.ab-leg{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .5rem;margin:.55rem 0 0;color:var(--muted);font-size:.8125rem;font-weight:600}
.ab-leg span{width:.8rem;height:.8rem;border-radius:.2rem;display:inline-block}
.ab-leg span + span,.ab-leg .ab-of{margin-left:.6rem}
.ab-ja{background:var(--accent-fill)}
.ab-of{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.ab-ohne{margin:.5rem 0 0}
.bk-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:1.25rem 0 .2rem}
.ausblick .bk-kopf .bl{margin:0}
.bk-kopf .bl i{display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;margin-right:.45rem;vertical-align:-.04rem}
.bk-kopf b{font-size:.9375rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bk-liste{list-style:none;margin:0;padding:0}
.bk-liste li + li{border-top:1px solid var(--sep)}
.bk-liste button{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "p v";column-gap:1rem;row-gap:.05rem;width:100%;padding:.5rem 0;text-align:left}
.bk-n{grid-area:n;font-size:1.0625rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.bk-a{grid-area:a;font-size:1.0625rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bk-p{grid-area:p;color:var(--muted);font-size:.875rem;line-height:1.3;overflow-wrap:anywhere}
.bk-v{grid-area:v;color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bk-leer{margin:.15rem 0 0}
.bk .textlink{display:inline-block;margin-top:.1rem}
.ab-unten{margin-top:.8rem}
.ausblick.im-thema{margin-top:0}
.al-chart{display:flex;align-items:flex-end;gap:.3rem;height:11.5rem;position:relative}
.al-kap{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--warn);pointer-events:none}
.ab-leg .ab-kap{display:inline-block;width:1.1rem;height:0;border-radius:0;background:none;box-shadow:none;border-top:2px dashed var(--warn);margin:0 .1rem 0 .6rem;vertical-align:middle}
.al-m{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;height:100%;outline:none}
.al-s{height:9rem;margin-top:auto;display:flex;flex-direction:column-reverse}
.al-s i{display:block;width:100%;flex:none}
.al-s i:not(.of){background:var(--accent-fill);border-radius:0 0 .3rem .3rem}
.al-s i.of{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand);border-radius:.3rem .3rem 0 0}
.al-m span{display:block;text-align:center;color:var(--muted);font-size:.6875rem;font-weight:600;line-height:1.15;margin-top:.3rem;min-height:1.6rem}
.al-m:focus-visible .al-s{outline:2px solid var(--accent);outline-offset:2px}
.of-summe{margin:-.2rem 0 .6rem}
@media (max-width:700px){.ab-zahlen.vier{grid-template-columns:1fr 1fr}}
.ausblick .bl{margin-top:1.1rem}
.ab-liste{list-style:none;margin:0 0 .6rem;padding:0;display:flex;flex-direction:column;gap:.3rem}
.ab-liste button{display:flex;justify-content:space-between;gap:1rem;width:100%;padding:.5rem .8rem;border-radius:.75rem;background:var(--bg);font-weight:500}
.ab-liste button span{min-width:0;overflow-wrap:anywhere}
.ab-liste button b{font-variant-numeric:tabular-nums;white-space:nowrap}
.zweier{display:grid;grid-template-columns:minmax(0,1fr) 10rem auto;gap:.45rem;margin-top:.8rem}
.zweier input{min-width:0;height:3rem;padding:0 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--bg);font-size:1.0625rem}
.ab-notiz{color:var(--muted);margin-top:.8rem;white-space:pre-wrap;overflow-wrap:anywhere}
.e-schmal{width:auto;min-width:min(100%,20rem)}
/* Rückmeldung zum Tool */
.rseg{display:flex;flex-wrap:wrap;gap:.2rem;padding:.2rem;border-radius:.85rem;background:var(--fill)}
.rseg label{position:relative;flex:1 1 auto}
.rseg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.rseg span{display:grid;place-items:center;height:2.15rem;padding:0 .7rem;border-radius:.65rem;font-weight:600;font-size:.875rem;color:var(--muted);white-space:nowrap}
.rseg input:checked + span{background:var(--pill);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.rseg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.rm-teil{display:flex;flex-direction:column;gap:.7rem;border-top:1px solid var(--sep);padding-top:1rem}
.rm-teil > h3{font-size:1.0625rem;font-weight:700}
.rml{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.rml li{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .5rem .55rem .9rem;border-radius:.9rem;background:var(--bg)}
.rml li > div{flex:1;min-width:0}
.rml b{display:block;font-size:.8125rem;color:var(--muted);font-weight:600}
.rml p{margin-top:.1rem;overflow-wrap:anywhere;white-space:pre-wrap}
.rm-alt{border-top:1px solid var(--sep);padding-top:.8rem}
.rm-alt summary{cursor:pointer;color:var(--muted);font-weight:600;width:max-content;border-radius:.3rem}
.rm-alt[open] summary{margin-bottom:.7rem}
.rm-alt .reihe{margin-top:.7rem}

/* ---------- Ergebnis ---------- */
.blatt{max-width:52rem;margin:0 auto;padding:2rem 2.2rem}
.e-kopf{border-bottom:2px solid var(--accent);padding-bottom:.8rem;margin-bottom:1.2rem}
.e-kopf h1{font-size:1.875rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.e-kopf p{color:var(--muted)}
.e-teil{margin-bottom:1.4rem}
.e-teil > h2{font-size:1.1875rem;font-weight:700;color:var(--accent);margin-bottom:.5rem}
.e-teil h3{font-size:1rem;font-weight:700;margin:.8rem 0 .25rem}
.e-teil ul{list-style:disc;padding-left:1.2rem;display:flex;flex-direction:column;gap:.2rem}
.e-gl{background:var(--brand-soft);border-radius:1rem;padding:.9rem 1.1rem}
.e-gl ul,.e-teil ul.e-rz{list-style:none;padding:0;gap:.45rem}
.e-teil ul.e-fd,.e-teil ul.e-fdg{list-style:none;padding-left:0}
.e-gl li b{font-weight:700}
.e-marke{font-size:.6875rem;font-weight:700;color:var(--accent);margin-left:.4rem;letter-spacing:.03em}
.e-klein{color:var(--muted);font-size:.875rem;margin:-.3rem 0 .5rem}
.e-rz li{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;border-bottom:1px solid var(--sep);padding-bottom:.3rem}
.e-st{font-size:.8125rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.e-st.erreicht{color:var(--accent)}
.e-st.teilweise{color:var(--warn)}
.e-tab-rahmen{overflow-x:auto}
.e-tab,.e-besch{border-collapse:collapse;width:100%;font-size:.9375rem}
.e-tab th,.e-tab td{padding:.35rem .6rem .35rem 0;border-bottom:1px solid var(--sep);white-space:nowrap}
.e-tab th{text-align:left;font-weight:600}
.e-tab thead th,.e-besch thead th{color:var(--muted);font-size:.8125rem;font-weight:600}
.e-tab td,.e-tab thead th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.e-besch th,.e-besch td{text-align:left;vertical-align:top;padding:.35rem .9rem .35rem 0;border-bottom:1px solid var(--sep)}
.e-besch td.th{font-weight:600}
.e-besch td.nw{white-space:nowrap}
.e-grau{color:var(--muted)}
.e-fuss{color:var(--muted);font-size:.8125rem}
.aktionen{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;max-width:52rem;margin:1rem auto 0}

/* ---------- Sheets ---------- */
.sheet-huelle{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{position:relative;width:100%;max-width:34rem;max-height:92%;display:flex;flex-direction:column;background:var(--card);border-radius:1.5rem 1.5rem 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
.sheet.rein{animation:sheetIn .26s cubic-bezier(.2,.8,.2,1)}
.scrim.rein{animation:fadeIn .2s ease-out}
@media (pointer:coarse){.scrim{cursor:pointer}}
.sheet > header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem;padding:.85rem 1rem .7rem;border-bottom:1px solid var(--sep)}
.sheet > header h2{font-size:1.0625rem;font-weight:700;text-align:center}
.tbtn{justify-self:start;height:2.25rem;padding:0 .5rem;border-radius:.6rem;color:var(--accent);font-weight:500}
.tbtn.stark{justify-self:end;font-weight:700}
.sheet-inhalt{overflow-y:auto;padding:1rem 1rem 1.5rem;display:flex;flex-direction:column;gap:.9rem;overscroll-behavior:contain}
.sheet .ablage{margin:0;padding:1.4rem 1rem;max-width:none}
.f{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.f > span{font-size:.8125rem;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{width:100%;min-height:2.9rem;padding:.6rem .8rem;border-radius:.85rem;border:1px solid var(--sep);background:var(--bg);font-size:1rem}
.f textarea{resize:vertical;min-height:5.5rem;line-height:1.4}
.f .fehlt{border-color:var(--alarm)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.schalter{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem .9rem;border-radius:.9rem;background:var(--bg);font-weight:500}
.schalter input{width:1.4rem;height:1.4rem;accent-color:var(--accent-fill)}
.loesch{align-self:flex-start;display:inline-flex;align-items:center;gap:.4rem;color:var(--alarm);font-weight:600;padding:.5rem 0}
.gr{display:flex;flex-direction:column;gap:.7rem;padding-bottom:1.1rem;border-bottom:1px solid var(--sep)}
.gr > h3{font-size:1.0625rem;font-weight:700}
.reihe{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.reihe.zw{justify-content:space-between}
.stepper{display:flex;align-items:center;gap:.2rem}
.stepper button{width:2.25rem;height:2.25rem;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent)}
.stepper b{min-width:4rem;text-align:center}
.spl{display:flex;flex-direction:column;gap:.5rem}
.spl li{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:.2rem .7rem;padding:.55rem .8rem;border-radius:.9rem;background:var(--bg)}
.spl li.spl-datei{display:block;background:none;padding:.5rem .2rem 0;font-size:.8125rem;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.spl input[type="checkbox"]{width:1.4rem;height:1.4rem;accent-color:var(--accent-fill)}
.spl input[type="text"]{min-width:0;height:2.5rem;padding:0 .7rem;border-radius:.7rem;border:1px solid var(--sep);background:var(--card);font-weight:600}
.spl small{grid-column:2;color:var(--muted);font-size:.8125rem}
.hinweis{display:flex;align-items:flex-start;gap:.5rem;color:var(--warn);background:var(--warn-soft);padding:.7rem .9rem;border-radius:.9rem;font-size:.9375rem}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:.9rem;padding:.75rem 1.1rem;border-radius:1.1rem;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:toastIn .22s cubic-bezier(.2,.8,.2,1);width:max-content;max-width:calc(100% - 2rem)}
.toast button{color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:.15em;white-space:nowrap}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.sheet.rein,.scrim.rein,.toast{animation:none}}

@media (min-width:40rem){

  .ab-zahlen{grid-template-columns:1fr 1fr}

  .zweier{grid-template-columns:minmax(0,1fr) 6.5rem auto}
  .blatt{padding:1.3rem 1.2rem}

  .dg-innen{height:11rem}

/* Unterpunkte stehen direkt hinter ihrem Thema («eltern» nennt es). Es gibt zwei Ebenen: Ein Unterpunkt hat selbst keine Unterpunkte. */
function ordnen(T) {
  const nach = {};
  T.forEach((x) => { nach[x.id] = x; });
  T.forEach((x) => { const e = nach[x.eltern]; if (!e || e === x) x.eltern = ''; });
  T.forEach((x) => {   // ein Unterpunkt eines Unterpunkts rückt zum obersten Thema
    let e = nach[x.eltern], n = 0;
    while (e && e.eltern && n < 20) { e = nach[e.eltern]; n++; }
    x.eltern = e && n < 20 && e !== x ? e.id : '';
  });
  const aus = [];
  T.forEach((x) => { if (x.eltern) return; aus.push(x); T.forEach((k) => { if (k.eltern === x.id) aus.push(k); }); });
  return aus;
}

/* ---------- Neues Jahr (seit 1.0) ----------

   Entscheide der GL → Rückblick (nur mit eingeschaltetem Reiter GL zu sehen). Bleiben: Themenliste mit Fragen, Unterpunkten und
   Ansichten, Gruppenzuteilung (wieder offen), Mitarbeiterliste, Zahlen, Kunden, offener Bedarf, GL-Themen und was an der GL noch nicht
   gesagt ist. Leer: Notizen, Stichworte, Beschlüsse, Baustellen, Felder, Anhänge, Ausblick. Parkplatz (seit 1.2): Offenes bleibt,
   Besprochenes mit Wer oder Bis wann kommt zu den Beschlüssen vom letzten Jahr. */

  return { id: uid(), jahr: Number(String(S.meta.datum || '').slice(0, 4)) || new Date().getFullYear(), titel: S.meta.titel, abgeschlossen: new Date().toISOString(),
    meta: kopie(S.meta), themen: T, parkplatz: kopie(S.parkplatz), budget: kopie(S.budget), mitarbeiter: kopie(S.mitarbeiter),
    gl: { gruppen: kopie(S.glGruppen), punkte: kopie(S.glPunkte.map((x) => Object.assign({}, x, { quelle: undefined, weg: undefined }))), felder: kopie(S.glFelder) } };
}
function neuesJahr() {
  const a = archivEintrag(), T = S.themen, nameVon = (id) => { const t = T.find((x) => x.id === id); return t ? t.titel : ''; };
  const zieleNeu = [], beschlVJ = [];

    else beschlVJ.push({ id: uid(), was: b.was, wer: b.wer || '', bis: b.bis || '', thema: t.eltern ? nameVon(t.eltern) + ' · ' + t.titel : t.titel, stand: b.erl ? 'erledigt' : '' });
  }));
  S.parkplatz.forEach((x) => { if (x.an && (x.wer || x.bis)) beschlVJ.push({ id: uid(), was: x.text + (x.antwort ? ': ' + x.antwort : ''), wer: x.wer, bis: x.bis, thema: 'Parkplatz', stand: '' }); });   // seit 1.2
  const glVJ = S.glPunkte.filter((x) => x.ergebnis).map((x) => ({ id: uid(), text: x.text, ergebnis: x.ergebnis, gruppe: (S.glGruppen.find((g) => g.id === x.gruppe) || {}).titel || '' }));
  const rb = T.find((t) => t.art === 'rueckblick');

  S.parkplatz = S.parkplatz.filter((x) => !x.an).map((x) => ({ id: x.id, text: x.text, an: false, antwort: '', wer: '', bis: '', gl: false, vj: x.vj || vj }));
  S.budget = { ziel: null, auftraege: [], notiz: '' };

/* ---------- Reiter GL (seit 1.0): was am Strategietag mit «GL» markiert ist, steht dort als Punkt ----------
   Der Text kommt vom Thema; Gruppe (GL-Thema), «gesagt» und Ergebnis gehören dem GL-Punkt. Wird die Marke entfernt,
   bleibt der Punkt nur, wenn er schon einem GL-Thema zugeordnet, gesagt oder mit Ergebnis ist (dann mit Hinweis). */
function glMarkiert() {
  const L = [];
  S.themen.forEach((t) => {
    t.notizen.forEach((n) => { if (n.gl) L.push({ q: 'n:' + n.id, text: n.text, thema: t.titel }); });
    t.beschluesse.forEach((b) => { if (b.gl) L.push({ q: 'b:' + b.id, text: (t.art === 'ziele' ? 'Ziel: ' : 'Beschluss: ') + b.was + (metaText(b) ? ' (' + metaText(b) + ')' : ''), thema: t.titel }); });
    t.bedarf.forEach((b) => { if (b.gl) L.push({ q: 'd:' + b.id, text: 'Bedarf: ' + b.was + (bedarfMeta(b) ? ' (' + bedarfMeta(b) + ')' : '') + ', Stand: ' + BSTAND[b.stand], thema: t.titel }); });
  });
  S.parkplatz.forEach((x) => { if (x.gl) L.push({ q: 'k:' + x.id, text: x.text + (x.antwort ? ': ' + x.antwort : '') + (metaText(x) ? ' (' + metaText(x) + ')' : ''), thema: 'Parkplatz' }); });   // seit 1.2

    if (!/^data:image\//.test(url)) return;
    if (!/^data:image\/(svg|gif)/.test(url)) url = await bildKleiner(url);

    if (sheet) sheet.rmBild = { id: id, name: 'Bild', typ: url.slice(5, url.indexOf(';')) || 'image/png', groesse: Math.round((url.length - url.indexOf(',') - 1) * 0.75) };
    renderSheet(false);

}
function pngAus(url) {   // Bild als PNG fuer die Zwischenablage
  return new Promise((ok, nein) => {
    const img = new Image();
    img.onload = () => { try { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); c.toBlob((b) => (b ? ok(b) : nein(new Error('leer'))), 'image/png'); } catch (e) { nein(e); } };
    img.onerror = () => nein(new Error('Bild'));
    img.src = url;
  });
}

function dateiname() { return datei.vorschlag || 'Strategietag_' + (S.meta.datum || 'ohne-Datum') + '.html'; }
function dateiInhalt() {
  const AUF = '<scr' + 'ipt id="daten" type="application/json">', ZU = '</scr' + 'ipt>';
  const a = VORLAGE.indexOf(AUF);
  if (a < 0) return null;
  const b = VORLAGE.indexOf(ZU, a);
  const json = JSON.stringify({ app: 'strategietag-bi', v: FORMAT, version: VERSION, gesichertAm: new Date().toISOString(), daten: S }, mitAnhaengen).replace(/</g, '\\u003c').replace(ZEILENTRENNER, (c) => '\\u' + c.charCodeAt(0).toString(16));
  return VORLAGE.slice(0, a + AUF.length) + json + VORLAGE.slice(b);
}
/* weg: '' = der übliche Weg dieses Geräts, 'datei' = in eine gewählte Datei schreiben, 'herunter' = herunterladen */
async function sichern(still, weg) {
  if (IM_RAHMEN) { if (!still) auf({ art: 'sichern' }); return; }
  const text = dateiInhalt();
  if (!text) { if (!still) toast('Sichern ist hier nicht möglich.'); return; }
  const kopfNeu = () => { $('#kopf').innerHTML = kopfHTML(); $('#oben').innerHTML = obenHTML(); if (sheet && sheet.art === 'einstellungen') renderSheet(false); };
  // 1. Direkt in die Datei: am Rechner (Edge, Chrome). Einmal wählen, danach gehen Änderungen von selbst hinein.
  const teilen = TEILEN_ZUERST && kannTeilen();
  if (weg !== 'herunter' && (datei.handle || (window.showSaveFilePicker && (weg === 'datei' || !teilen)))) {
    try {
      if (!datei.handle) {
        if (still) return;
        datei.handle = await window.showSaveFilePicker({ suggestedName: dateiname(), types: [{ description: 'Strategietag', accept: { 'text/html': ['.html'] } }] });
      }
      const w = await datei.handle.createWritable();
      await w.write(text); await w.close();
      datei.name = datei.handle.name; nameMerken(datei.name); gesichertMerken();
      kopfNeu();
      if (!still) toast('Gesichert als «' + datei.name + '». Diese Datei enthält alles; Änderungen gehen ab jetzt von selbst hinein.');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      datei.handle = null;
      if (still) { kopfNeu(); toast('Das laufende Sichern klappt nicht mehr. Bitte «Sichern» drücken.'); return; }
    }
  }
  if (still) return;
  // 2. iPad und Handy: über das Teilen-Fenster in den eigenen Ordner legen
  if (weg !== 'herunter' && weg !== 'datei' && teilen) {
    try {
      await navigator.share({ files: [new File([text], dateiname(), { type: 'text/html' })] });
      datei.name = dateiname(); gesichertMerken();
      kopfNeu();
      toast('Weitergegeben als «' + datei.name + '». Lege die Datei in deinem Ordner ab und ersetze die alte.');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // Teilen-Fenster geschlossen: nichts gesichert
    }
  }
  // 3. Sonst als Download
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
  a.href = url; a.download = dateiname(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
  datei.name = dateiname(); gesichertMerken();
  kopfNeu();
  toast('Gesichert als «' + datei.name + '» im Ordner «Downloads». Diese Datei enthält alles: zum Weitermachen per Doppelklick öffnen oder im Tool laden.');
}

/* Mitarbeiter aus Excel: je Zeile Name, Position, Polier, Eintritt, Austritt. Eine Kopfzeile ordnet die Spalten; «Vorname» und
   «Name» werden zusammengesetzt. Ohne Tabulator trennt der Strichpunkt. */
function maLesen(text) {
  let Z = String(text || '').replace(/\r/g, '').split('\n').map((z) => (z.indexOf('\t') >= 0 ? z.split('\t') : z.split(';')).map((x) => x.replace(/\s+/g, ' ').trim())).filter((z) => z.some(Boolean));
  if (!Z.length) return [];
  const SP = [['vorname', /^vorname$/i], ['name', /^(name|nachname|mitarbeiter(in)?|mitarbeitende|person)$/i], ['position', /^(position|funktion|stelle|beruf|rolle)$/i],
    ['polier', /^(polier|gruppe|stammgruppe|zuteilung|team)$/i], ['eintritt', /^(eintritt\S*|seit|ab)$/i], ['austritt', /^(austritt\S*|bis|pensionierung|far)$/i],
    ['geburt', /^(geburtsdatum|geburtstag|geboren|geb\.?|jahrgang)$/i]];
  const kopf = {};
  Z[0].forEach((x, i) => { const s = SP.find((p) => p[1].test(x)); if (s && kopf[s[0]] === undefined) kopf[s[0]] = i; });
  if (kopf.name !== undefined && (Object.keys(kopf).length >= 2 || Z[0].length === 1)) Z = Z.slice(1);
  else ['name', 'position', 'polier', 'eintritt', 'austritt'].forEach((k, i) => { kopf[k] = i; delete kopf.vorname; });
  return Z.map((z) => {
    const w = (k) => (kopf[k] === undefined ? '' : z[kopf[k]] || '');
    return { name: [w('vorname'), w('name')].filter(Boolean).join(' '), position: w('position'), polier: w('polier'), eintritt: w('eintritt'), austritt: w('austritt'), geburt: w('geburt') };
  }).filter((x) => x.name);
}
/* Gelesene Zeilen in die Liste: Wer schon drin ist (gleicher Name), wird ergänzt; der Polier wird am Namen gesucht und, wenn er
   fehlt, als Polier angelegt. probe: nur zählen. */
function maAnwenden(Z, probe) {
  const L = probe ? S.mitarbeiter.map((m) => Object.assign({}, m)) : S.mitarbeiter, n = { neu: 0, alt: 0 }, vorher = L.slice(), belegt = [];
  const finde = (name) => L.find((m) => nameSchluessel(m.name) === nameSchluessel(name)) || null;
  const findePolier = (name) => { const x = finde(name); if (x) return x; const w = nameWoerter(name), P = L.filter((m) => istPolier(m) && w.every((y) => nameWoerter(m.name).indexOf(y) >= 0)); return P.length === 1 ? P[0] : null; };
  const hole = (name, position) => { let m = finde(name); if (!m) { m = { id: uid(), name: name, position: position || '', polier: '', eintritt: '', austritt: '', geburt: '' }; L.push(m); n.neu++; } return m; };
  /* Steht jemand nur mit einem Teil des Namens in der Liste (z. B. von der Tafel «Muster» statt «Hans Muster»), ist er derselbe, wenn
     es genau eine solche Person gibt und nur eine Zeile der neuen Liste zu ihr passt. Er bekommt dann den Namen aus der Liste. */
  const genau = Z.map((z) => finde(z.name)).filter(Boolean);
  const teil = (z) => {
    const w = nameWoerter(z.name), K = vorher.filter((m) => genau.indexOf(m) < 0 && belegt.indexOf(m) < 0 && nameWoerter(m.name).length && nameWoerter(m.name).every((y) => w.indexOf(y) >= 0));

   eines Felds «Gruppen» wandern auch in eine andere Spalte ihres Bretts ([data-brett] mit [data-spalte]); alles andere bleibt in

function markenWeg() { $$('.ein-vor,.ein-nach').forEach((x) => { x.classList.remove('ein-vor', 'ein-nach'); }); }
function zugEnde() {

  if (zug.el) zug.el.classList.remove('zieht', 'hebt');

  markenWeg();
