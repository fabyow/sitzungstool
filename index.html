<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategietag</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300767E'/%3E%3Cpath d='M17 46V32M32 46V18M47 46V26' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Ruhige Fläche, Glas-Leiste, Vertiefung in Sheets.
   Aufbau: drei Bereiche in der Leiste (Zahlen, Themen, Ergebnis), je ein Bildschirm, eine Aufgabe.
   Diagrammfarben (--dz-*): geprüfter Satz für hell und dunkel; Blau = Ertrag und was bleibt, Grau = Aufwand und Übriges. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73;
  --sep:rgba(60,60,67,.12); --fill:rgba(120,120,128,.10);
  --accent:#00767E; --accent-fill:#00767E; --brand:#008C95; --brand-soft:#E3F3F4;
  --idle:#C7C7CC; --alarm:#D70015; --warn:#B45309; --warn-soft:rgba(255,149,0,.15);
  --scrim:rgba(0,0,0,.24); --glass:rgba(245,245,247,.82); --pill:#FFFFFF;
  --dz-blau:#2a78d6; --dz-orange:#eb6834; --dz-aqua:#1baf7a; --dz-gelb:#eda100; --dz-grau:#8E8E93; --dz-grau2:#5E5E62; --dz-gelb-ink:#0b0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-modus="hell"]){
    --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#98989F;
    --sep:rgba(84,84,88,.48); --fill:rgba(120,120,128,.24);
    --accent:#5CCBD2; --accent-fill:#00767E; --brand:#2FB5BE; --brand-soft:#0E3436;
    --idle:#545458; --alarm:#FF6961; --warn:#FFB340; --warn-soft:rgba(255,159,10,.18);
    --scrim:rgba(0,0,0,.58); --glass:rgba(18,18,20,.80); --pill:#48484A;
    --dz-blau:#3987e5; --dz-orange:#d95926; --dz-aqua:#199e70; --dz-gelb:#c98500; --dz-gelb-ink:#ffffff;
    --shadow:0 0 0 1px rgba(255,255,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-modus="hell"]), :root[data-modus="dunkel"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --muted:#98989F;
  --sep:rgba(84,84,88,.48); --fill:rgba(120,120,128,.24);
  --accent:#5CCBD2; --accent-fill:#00767E; --brand:#2FB5BE; --brand-soft:#0E3436;
  --idle:#545458; --alarm:#FF6961; --warn:#FFB340; --warn-soft:rgba(255,159,10,.18);
  --scrim:rgba(0,0,0,.58); --glass:rgba(18,18,20,.80); --pill:#48484A;
  --dz-blau:#3987e5; --dz-orange:#d95926; --dz-aqua:#199e70; --dz-gelb:#c98500; --dz-gelb-ink:#ffffff;
  --shadow:0 0 0 1px rgba(255,255,255,.05);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.gesperrt{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.klein{font-size:.8125rem}
.warn{color:var(--warn)}
.mitte{text-align:center}
.ic{width:1.2em;height:1.2em;flex:none}

/* ---------- Leiste ---------- */
.probe{display:flex;flex-wrap:wrap;justify-content:center;gap:.1rem .9rem;background:var(--warn-soft);color:var(--warn);font-size:.8125rem;font-weight:600;text-align:center;padding:.35rem 1rem}
.probe button{font-weight:600;text-decoration:underline;text-underline-offset:.15em}
.probe.leise{background:var(--brand-soft);color:var(--ink);font-weight:500}
.probe .zu{text-decoration:none;font-size:1.1rem;line-height:1;padding:0 .35rem;color:var(--muted)}
.ohne-js{max-width:30rem;margin:18vh auto;padding:1.5rem;text-align:center;font-size:1.0625rem;line-height:1.5}
.vergleich{border-collapse:collapse;width:100%}
.vergleich th{text-align:left;font-weight:600;color:var(--muted);padding:.4rem .9rem .4rem 0;white-space:nowrap;vertical-align:top}
.vergleich td{padding:.4rem 0}
.vergleich tr + tr th,.vergleich tr + tr td{border-top:1px solid var(--sep)}
.kopf{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--sep)}
.kopf1{display:flex;align-items:center;gap:.6rem 1rem;max-width:84rem;margin:0 auto;padding:.6rem 1rem}
.marke{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.marke b{font-family:var(--display);font-size:1.0625rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marke span{color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf-r{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:.4rem}
.rundb{position:relative;width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none}
.badge{position:absolute;top:-.2rem;right:-.2rem;min-width:1.2rem;height:1.2rem;padding:0 .3rem;border-radius:.6rem;background:var(--accent-fill);color:#fff;font-size:.6875rem;font-weight:700;font-style:normal;display:grid;place-items:center}
.pliste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.pliste li{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem .5rem .5rem .9rem;border-radius:.9rem;background:var(--bg);font-weight:500;font-size:1.0625rem;overflow-wrap:anywhere}
.pliste li.leer{background:transparent;padding:.4rem 0;color:var(--muted);font-weight:400}
.xk{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--fill);flex:none}
.xk .ic{width:1rem;height:1rem}
.seg{display:inline-flex;padding:.2rem;border-radius:.85rem;background:var(--fill)}
.seg button{height:2.15rem;padding:0 .9rem;border-radius:.65rem;font-weight:600;font-size:.9375rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.bereich button{height:2.4rem;padding:0 1.3rem;font-size:1rem}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:0 1.1rem;border-radius:1.375rem;font-weight:600;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn.stark{background:var(--accent-fill);color:#fff}
.btn.rot{color:var(--alarm)}
.btn.scharf{background:var(--alarm);color:#fff}
.btn.klein{min-height:2.5rem;padding:0 .9rem}
.punkt{position:absolute;top:.1rem;right:.1rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}

/* ---------- Bausteine ---------- */
main{max-width:84rem;margin:0 auto;padding:1.5rem 1rem 4rem}
.titel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.75rem 1rem;margin-bottom:1rem}
.titel > div:first-child{flex:1;min-width:12rem}
.titel h1{font-size:2rem;line-height:1.1;font-weight:700;letter-spacing:-.022em}
.titel p{color:var(--muted);font-size:1.0625rem;margin-top:.3rem}
.titel-r{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.card{background:var(--card);border-radius:1.25rem;padding:1.15rem 1.25rem;box-shadow:var(--shadow)}
.leer{color:var(--muted);padding:.4rem 0}
.schnell{display:flex;gap:.45rem}
.schnell input,.dreier input{flex:1;min-width:0;height:3rem;padding:0 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);font-size:1.0625rem}
.rund{width:3rem;height:3rem;border-radius:50%;background:var(--accent-fill);color:#fff;display:grid;place-items:center;flex:none}
.textlink{color:var(--muted);font-size:.875rem;text-decoration:underline;text-underline-offset:.15em;padding:.4rem 0}

/* ---------- Zahlen: Einfügen und Tabelle ---------- */
.ablage{display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center;padding:2.2rem 1.25rem;max-width:44rem;margin:1rem auto;border:1.5px dashed var(--idle);box-shadow:none;background:transparent}
.ablage > .ic{width:2.2rem;height:2.2rem;color:var(--accent)}
.ablage h2{font-size:1.375rem;font-weight:700}
.ablage p{max-width:32rem}
.einfuegen{width:100%;max-width:26rem;min-height:3rem;padding:.75rem 1rem;border-radius:1rem;border:1px solid var(--sep);background:var(--card);resize:none;text-align:center;font-size:1rem}
body.drueber .ablage,body.drueber .tab-rahmen,body.drueber .dg{border-color:var(--brand);background:var(--brand-soft)}
.tab-rahmen{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);overflow:auto;max-height:max(18rem,calc(100vh - 16.5rem));border:1.5px solid transparent}
.zt{border-collapse:separate;border-spacing:0;width:100%;font-size:.9375rem}
.zt th,.zt td{padding:.42rem .9rem;white-space:nowrap;border-bottom:1px solid var(--sep)}
.zt thead th{position:sticky;top:0;z-index:2;background:var(--card);font-weight:600;color:var(--muted);text-align:right;font-size:.875rem;padding-top:.8rem;padding-bottom:.6rem}
.zt thead th.bez{left:0;z-index:3}
.zt thead th.bez,.zt tbody th{text-align:left}
.zt thead th button{font-weight:600;color:inherit;padding:.15rem .4rem;margin:-.15rem -.4rem;border-radius:.4rem}
.zt thead th button:hover{background:var(--fill)}
.zt td.bud{background:var(--fill)}
.zt thead th.bud{background:linear-gradient(var(--fill),var(--fill)) var(--card)}
.zt tbody th{position:sticky;left:0;background:var(--card);font-weight:400;max-width:22rem;overflow:hidden;text-overflow:ellipsis;z-index:1}
.zt td{text-align:right;font-variant-numeric:tabular-nums}
.zt .nr{color:var(--muted);font-size:.8125rem;margin-right:.5rem;font-variant-numeric:tabular-nums}
.zt tr.s1 th,.zt tr.s1 td{font-weight:600}
.zt tr.klick{cursor:pointer}
.zt .aufb{display:inline-flex;align-items:center;gap:.3rem;font-weight:inherit;max-width:100%}
.zt .aufb span{overflow:hidden;text-overflow:ellipsis}
.zt .aufb .ic{width:.95em;height:.95em;color:var(--muted);transition:transform .15s}
.zt tr.offen .aufb .ic{transform:rotate(90deg)}
.zt tr.kt th{padding-left:2.2rem;color:var(--muted)}
.zt tr.kt td{color:var(--muted)}
.zt.pf tbody th,.zt.pf thead th.bez{padding-left:2.2rem}
.zt.pf tr.klick th{padding-left:.75rem}
.zt.pf tr.kt th{padding-left:3.4rem}
.zt tr.s2 th,.zt tr.s2 td{font-weight:700;font-size:1.12em;border-top:1px solid var(--sep);background:var(--brand-soft)}
.zt tr.s3 th,.zt tr.s3 td{font-weight:700;font-size:1.25em;background:var(--brand-soft);color:var(--accent)}
/* viele Spalten: enger setzen, damit der Verlauf auf einen Bildschirm passt */
.zt.dicht{font-size:.8125rem}
.zt.dicht th,.zt.dicht td{padding-left:.45rem;padding-right:.45rem}
.zt.dicht thead th{white-space:normal;font-size:.75rem;vertical-align:bottom}
.zt.dicht tbody th{max-width:14rem}
.zt.dicht tr.s2 th,.zt.dicht tr.s2 td{font-size:1em}
.zt.dicht tr.s3 th,.zt.dicht tr.s3 td{font-size:1.1em}
.zt.dicht td:last-child,.zt.dicht thead th:last-child{padding-right:.9rem}
.zt tr.abg th,.zt tr.abg td{font-weight:600}
.zt tr.std th,.zt tr.std td{color:var(--muted)}
.zt tr.std.s1 th,.zt tr.std.s1 td{color:var(--ink)}
.zt .neg{color:var(--alarm)}
.zt tr:last-child th,.zt tr:last-child td{border-bottom:0}
.unter{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;margin-top:.6rem}

/* ---------- Zahlen: Diagramme ---------- */
.c-blau{background:var(--dz-blau)} .c-orange{background:var(--dz-orange)} .c-aqua{background:var(--dz-aqua)} .c-gelb{background:var(--dz-gelb)} .c-grau{background:var(--dz-grau)} .c-grau2{background:var(--dz-grau2)}
.dgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:1rem}
.dg{background:var(--card);border-radius:1.25rem;box-shadow:var(--shadow);padding:1.1rem 1.25rem 1rem;min-width:0;border:1.5px solid transparent}
.dg h2{font-size:1.1875rem;font-weight:700}
.dg-u{color:var(--muted);font-size:.9375rem;margin:.1rem 0 .7rem}
.dg-leg{display:flex;flex-wrap:wrap;gap:.25rem 1.1rem;font-size:.875rem;color:var(--muted)}
.dg-leg span{display:inline-flex;align-items:center;gap:.4rem}
.dg-leg i{width:.75rem;height:.75rem;border-radius:.2rem;flex:none}
.dg-leg i.halb{opacity:.45}
.dg-feld{padding:1.9rem 0 0 4.2rem}
.dg-innen{position:relative;height:13rem;border-bottom:1px solid var(--idle)}
.dg-g{position:absolute;left:0;right:0;border-top:1px solid var(--sep)}
.dg-t{position:absolute;left:-4.2rem;width:3.8rem;text-align:right;transform:translateY(50%);font-size:.75rem;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dg-baender{position:absolute;inset:0;display:flex}
.dg-band{flex:1;min-width:0;position:relative;border-radius:.5rem .5rem 0 0;outline-offset:-2px}
.dg-band:hover,.dg-band:focus-visible,.dg-seg i:hover,.dg-seg i:focus-visible{filter:brightness(1.08)}
.dg-band:hover,.dg-band:focus-visible{background:var(--fill)}
.dg-paar{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%}
.dg-b{display:block;width:min(1.25rem,32%);min-height:1px;border-radius:.25rem .25rem 0 0}
.dg-st{display:flex;flex-direction:column-reverse;gap:2px;width:min(1.4rem,40%)}
.dg-st i{display:block;min-height:1px}
.dg-st i:last-child{border-radius:.25rem .25rem 0 0}
.dg-band.bud .dg-b,.dg-band.bud .dg-st{opacity:.45}
.dg-o{position:absolute;left:50%;transform:translateX(-50%);margin-bottom:.3rem;font-size:.8125rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dg-feld.eng .dg-o,.dg-feld.eng + .dg-n .dg-on{display:none}
.dg-x{display:flex;margin-top:.45rem}
.dg-x span{flex:1;min-width:0;text-align:center;font-size:.8125rem;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.dg-zeilen{display:flex;flex-direction:column;gap:.55rem;margin-top:.8rem}
.dg-z{display:flex;align-items:center;gap:.6rem}
.dg-zn{width:5.2rem;flex:none;font-size:.875rem;color:var(--muted);line-height:1.2}
.dg-seg{position:relative;flex:1;min-width:0;display:flex;gap:2px;height:1.75rem}
.dg-seg i{display:flex;align-items:center;min-width:0;border-radius:.25rem;font-style:normal;outline-offset:1px}
.dg-seg b{display:none;padding-left:.4rem;font-size:.875rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.dg-seg i.s9 b{display:block}
.dg-seg i.c-gelb b{color:var(--dz-gelb-ink)}
/* Marke bei 100 Franken: nur Striche über und unter dem Balken, damit sie keine Zahl durchkreuzt */
.dg-seg u{position:absolute;top:-.35rem;bottom:-.35rem;width:2px;margin-left:-1px;background:linear-gradient(var(--ink) 0 .3rem,transparent .3rem calc(100% - .3rem),var(--ink) calc(100% - .3rem) 100%)}
.dg-ende{width:5.6rem;flex:none;font-size:.875rem;font-weight:600;white-space:nowrap}
.dg-n{color:var(--muted);font-size:.8125rem;margin-top:.6rem}
.dg-leer{color:var(--muted);padding:1.2rem 0}
.dg-werte{margin-top:.7rem;border-top:1px solid var(--sep);padding-top:.5rem}
.dg-werte summary{cursor:pointer;color:var(--muted);font-size:.8125rem;font-weight:600;width:max-content;border-radius:.3rem}
.dg-wt{overflow-x:auto;margin-top:.4rem}
.dg-wt table{border-collapse:collapse;width:100%;font-size:.8125rem}
.dg-wt th,.dg-wt td{padding:.25rem .6rem .25rem 0;border-bottom:1px solid var(--sep);white-space:nowrap}
.dg-wt th{text-align:left;font-weight:600}
.dg-wt thead th{color:var(--muted)}
.dg-wt td,.dg-wt thead th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:70;left:0;top:0;max-width:18rem;padding:.5rem .7rem;border-radius:.7rem;background:var(--ink);color:var(--bg);font-size:.8125rem;line-height:1.35;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip strong{display:block;font-weight:700}
#tip[hidden]{display:none}

/* ---------- Themen ---------- */
.themen{display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.5rem;align-items:start}
.tliste2{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:5rem;max-height:calc(100vh - 6rem);overflow-y:auto;scrollbar-width:thin;padding:.2rem;margin:-.2rem}
.tlink{display:flex;align-items:center;gap:.6rem;min-height:2.9rem;padding:.3rem .8rem .3rem .5rem;border-radius:.9rem;font-weight:600;color:var(--muted)}
.tlink .nr{width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-size:.8125rem;font-weight:700;flex:none}
.tlink .tl-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink .ok{color:var(--accent);width:1.1rem;height:1.1rem}
.tlink.on{background:var(--brand-soft);color:var(--accent)}
.tlink.on .nr{background:var(--accent-fill);color:#fff}
.tlink.neu{color:var(--accent);padding-left:.8rem}
.tz{display:contents}
.tlink.offen{color:var(--ink)}
.tlink .nr .ic{width:.95rem;height:.95rem}
.tlink .tl-z{min-width:1.25rem;height:1.25rem;padding:0 .3rem;border-radius:.65rem;background:var(--fill);font-size:.75rem;font-weight:700;display:grid;place-items:center;flex:none}
.tlink.kind{min-height:2.4rem;padding-left:1.15rem;font-weight:500;font-size:.9375rem}
.tlink.kind .nr{width:auto;min-width:1.9rem;height:auto;border-radius:0;background:none;display:block;font-size:.8125rem;font-weight:600}
.tlink.kind.on .nr{background:none;color:inherit}
.tlink.neu.leise{color:var(--muted);font-weight:500;min-height:2.4rem}
.pfad{display:inline-flex;align-items:center;gap:.2rem;color:var(--muted);font-weight:600;font-size:.9375rem;padding:.2rem 0;margin:0 0 .3rem -.2rem}
.pfad .ic{width:1.05rem;height:1.05rem}
.tnr{color:var(--muted);font-weight:600}
.uliste{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.4rem}
.urow{display:flex;align-items:center;gap:.7rem;min-height:3.1rem;padding:.4rem .7rem .4rem 1.1rem;border-radius:1rem;background:var(--card);box-shadow:var(--shadow)}
.urow .u-nr{color:var(--muted);font-weight:700;font-size:.875rem;min-width:2rem;flex:none}
.urow .u-t{flex:1;min-width:0;font-size:1.1875rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.urow .u-m{color:var(--muted);font-size:.875rem;white-space:nowrap}
.urow .ok{color:var(--accent);width:1.1rem;height:1.1rem;flex:none}
.urow .pf{color:var(--muted);width:1.1rem;height:1.1rem;flex:none}
.bst-rahmen{overflow-x:auto;background:var(--card);border-radius:1rem;box-shadow:var(--shadow);margin-bottom:.6rem}
.bst{width:100%;border-collapse:collapse;font-size:1.0625rem}
.bst th{text-align:left;font-size:.8125rem;font-weight:700;color:var(--muted);padding:.65rem 1rem .4rem;white-space:nowrap}
.bst td{padding:.5rem 1rem;border-top:1px solid var(--sep);vertical-align:top}
.bst tbody tr{cursor:pointer}
.bst td:first-child{font-weight:500}
.bst td button{font-weight:inherit;overflow-wrap:anywhere}
.glseite{max-width:54rem}

.gr{display:flex;flex-direction:column;gap:.7rem;padding-bottom:1.1rem;border-bottom:1px solid var(--sep)}

@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

function diagrammDaten() {

  const gruppen = zs.filter((z, i) => z.art === 'summe' && z.stufe === 1 && (iE < 0 || i > iE) && (iA < 0 || i < iA));
  const std = zs.filter((z) => z.art === 'stunden' && z.stufe === 0);

  const summe = (liste, p, test) => liste.reduce((a, z) => (test(z.name) ? a + (wert(z, p) || 0) : a), 0);
  return spaltenWahl().map((p) => {
    const d = { name: p.name, bud: istBudget(p), E: wert(k.ertrag, p), A: wert(k.aufwand, p), h: wert(k.stunden, p) || null };
    d.G = d.E !== null && d.A !== null ? d.E - d.A : null;
    d.personal = summe(gruppen, p, (n) => /personal/i.test(n));
    d.material = summe(gruppen, p, (n) => /material/i.test(n));
    d.fremd = summe(gruppen, p, (n) => /fremd/i.test(n));
    d.eigene = summe(std, p, (n) => /monatslohn|stundenlohn|eigen/i.test(n));
    d.temp = summe(std, p, (n) => /temp/i.test(n));
    d.weitere = summe(std, p, (n) => !/monatslohn|stundenlohn|eigen|temp/i.test(n));

function achse(max) {   // runde Skala mit vier bis sechs Strichen

  const schritt = [1, 2, 2.5, 5, 10].map((f) => f * pot).find((s) => s >= roh - 1e-9);
  const top = Math.ceil(max / schritt - 1e-9) * schritt, ticks = [];
  for (let v = 0; v <= top + schritt / 2; v += schritt) ticks.push(v);
  return { max: top, ticks: ticks };
}
const legende = (eintraege) => '<div class="dg-leg">' + eintraege.map((e) => '<span><i class="' + e[0] + '"></i>' + esc(e[1]) + '</span>').join('') + '</div>';

function saeulen(D, o) {

  const ax = achse(Math.max.apply(null, D.map(hoehe).concat([0])));
  const proz = (v) => (Math.max(0, v) / ax.max * 100).toFixed(2) + '%';
  const gitter = ax.ticks.map((t) => '<i class="dg-g" style="bottom:' + proz(t) + '"></i><span class="dg-t" style="bottom:' + proz(t) + '">' + esc(o.achse ? o.achse(t) : kurz(t)) + '</span>').join('');
  const baender = D.map((d) => {
    const text = o.oben(d);
    const marken = o.stapel
      ? '<div class="dg-st" style="height:' + proz(hoehe(d)) + '">' + o.stapel.filter((s) => s.wert(d) > 0).map((s) => '<i class="' + s.klasse + '" style="flex:' + s.wert(d) + ' 1 0%"></i>').join('') + '</div>'
      : o.reihen.map((r) => r.wert(d) === null ? '' : '<i class="dg-b ' + r.klasse + '" style="height:' + proz(r.wert(d)) + '"></i>').join('');
    return '<div class="dg-band' + (d.bud ? ' bud' : '') + '" tabindex="0" data-tip="' + esc([d.name].concat(o.tip(d)).join('\n')) + '">' +
      (text ? '<span class="dg-o" style="bottom:' + proz(hoehe(d)) + '">' + esc(text) + '</span>' : '') + '<div class="dg-paar">' + marken + '</div></div>';
  }).join('');
  return '<div class="dg-feld"><div class="dg-innen">' + gitter + '<div class="dg-baender">' + baender + '</div></div><div class="dg-x">' + D.map((d) => '<span>' + esc(d.name) + '</span>').join('') + '</div></div>';
}

function themaInhalt(t, nr) {
  const u = TEIL.unter(t, nr || {});

  if (S.beispiel) return '<div class="probe"><span>Beispiel: alle Angaben sind erfunden</span>' + (IM_RAHMEN ? '' : '<button type="button" data-a="daten-wahl">Eigene gesicherte Datei laden</button>') + '</div>';

  if (hinweis === 'stand') return '<div class="probe leise"><span>Stand auf diesem Gerät: ' + zeitKnapp(S.stand) + '.</span><button type="button" data-a="daten-wahl">Neuere Datei laden</button><button type="button" class="zu" data-a="hinweis-zu" aria-label="Hinweis schliessen">×</button></div>';
  return '';
}
function render() {
  document.documentElement.style.fontSize = (16 * (S.meta.zoom || 1)) + 'px';
  if (S.meta.modus === 'hell' || S.meta.modus === 'dunkel') document.documentElement.setAttribute('data-modus', S.meta.modus);
  else document.documentElement.removeAttribute('data-modus');
  if (S.ui.bereich === 'gl' && !glAn) S.ui.bereich = 'zahlen';   // der Reiter «GL» ist auf diesem Gerät ausgeblendet
  const rollen = {};
  $$('.tz').forEach((z) => { rollen[z.dataset.h || '0'] = z.scrollLeft; });
  $('#oben').innerHTML = obenHTML();
  $('#kopf').innerHTML = kopfHTML();
  $('#haupt').innerHTML = ANSICHT[S.ui.bereich]();
  $$('.tz').forEach((z) => {   // schmale Bildschirme: Die Themenzeile bleibt, wo sie war, und zeigt das gewählte Thema
    if (z.scrollWidth <= z.clientWidth) return;
    z.scrollLeft = rollen[z.dataset.h || '0'] || 0;
    const on = $('.tlink.on', z) || $('.tlink.offen', z);
    if (!on) return;
    const a = on.getBoundingClientRect(), b = z.getBoundingClientRect();
    if (a.left < b.left || a.right > b.right) z.scrollLeft += a.left - b.left - (b.width - a.width) / 2;
  });
  tipWeg(); diagrammePassen();
}
let toastT = 0;
function toast(text, mitRueck) {
  $('#toasts').innerHTML = '<div class="toast" role="status"><span>' + esc(text) + '</span>' + (mitRueck ? '<button type="button" data-a="rueck">Rückgängig</button>' : '') + '</div>';
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toasts').innerHTML = ''; }, mitRueck ? 7000 : 5500);
}
let scharf = '';
function bestaetigt(el, text) {
  const a = el.dataset.a;
  if (scharf === a) { scharf = ''; return true; }
  scharf = a;
  const alt = el.innerHTML;
  el.textContent = text; el.classList.add('scharf');
  setTimeout(() => { if (scharf === a) scharf = ''; if (el.isConnected) { el.innerHTML = alt; el.classList.remove('scharf'); } }, 4000);
  return false;
}
/* Hinweis beim Zeigen oder mit der Tastatur: Text kommt aus data-tip und wird als reiner Text gesetzt */
function tipZeigen(el) {
  const t = $('#tip');
  t.textContent = '';
  el.dataset.tip.split('\n').forEach((zeile, i) => { const d = document.createElement(i ? 'div' : 'strong'); d.textContent = zeile; t.appendChild(d); });
  t.hidden = false;
  const r = el.getBoundingClientRect(), b = t.getBoundingClientRect();
  const x = Math.max(8, Math.min(r.left + r.width / 2 - b.width / 2, window.innerWidth - b.width - 8));
  const y = r.top - b.height - 8 < 8 ? Math.min(r.bottom + 8, window.innerHeight - b.height - 8) : r.top - b.height - 8;
  t.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
}
function tipWeg() { const t = $('#tip'); if (t) t.hidden = true; }
/* Stossen die Zahlen über den Säulen aneinander (schmaler Bildschirm, viele Jahre), bleiben sie in diesem Diagramm weg */
function diagrammePassen() {
  $$('.dg-feld').forEach((feld) => {
    feld.classList.remove('eng');
    const o = $$('.dg-o', feld).map((x) => x.getBoundingClientRect());
    if (o.some((r, i) => i > 0 && r.left < o[i - 1].right + 2)) feld.classList.add('eng');
  });
}

/* ---------- Sichern: die ganze Datei samt Inhalt ---------- */
function dateiname() { return datei.vorschlag || 'Strategietag_' + (S.meta.datum || 'ohne-Datum') + '.html'; }
function dateiInhalt() {
  const AUF = '<scr' + 'ipt id="daten" type="application/json">', ZU = '</scr' + 'ipt>';
  const a = VORLAGE.indexOf(AUF);
  if (a < 0) return null;
  const b = VORLAGE.indexOf(ZU, a);
  const json = JSON.stringify({ app: 'strategietag-bi', v: FORMAT, version: VERSION, gesichertAm: new Date().toISOString(), daten: S }).replace(/</g, '\\u003c').replace(ZEILENTRENNER, (c) => '\\u' + c.charCodeAt(0).toString(16));
  return VORLAGE.slice(0, a + AUF.length) + json + VORLAGE.slice(b);
}
/* weg: '' = der übliche Weg dieses Geräts, 'datei' = in eine gewählte Datei schreiben, 'herunter' = herunterladen */
async function sichern(still, weg) {
  if (IM_RAHMEN) { if (!still) auf({ art: 'sichern' }); return; }
  const text = dateiInhalt();
  if (!text) { if (!still) toast('Sichern ist hier nicht möglich.'); return; }
  const kopfNeu = () => { $('#kopf').innerHTML = kopfHTML(); $('#oben').innerHTML = obenHTML(); if (sheet && sheet.art === 'einstellungen') renderSheet(false); };
  // 1. Direkt in die Datei: am Rechner (Edge, Chrome). Einmal wählen, danach gehen Änderungen von selbst hinein.
  const teilen = TEILEN_ZUERST && kannTeilen();
  if (weg !== 'herunter' && (datei.handle || (window.showSaveFilePicker && (weg === 'datei' || !teilen)))) {
    try {
      if (!datei.handle) {
        if (still) return;
        datei.handle = await window.showSaveFilePicker({ suggestedName: dateiname(), types: [{ description: 'Strategietag', accept: { 'text/html': ['.html'] } }] });
      }
      const w = await datei.handle.createWritable();
      await w.write(text); await w.close();
      datei.name = datei.handle.name; nameMerken(datei.name); gesichertMerken();
      kopfNeu();
      if (!still) toast('Gesichert als «' + datei.name + '». Diese Datei enthält alles; Änderungen gehen ab jetzt von selbst hinein.');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      datei.handle = null;
      if (still) { kopfNeu(); toast('Das laufende Sichern klappt nicht mehr. Bitte «Sichern» drücken.'); return; }
    }
  }
  if (still) return;
  // 2. iPad und Handy: über das Teilen-Fenster in den eigenen Ordner legen
  if (weg !== 'herunter' && weg !== 'datei' && teilen) {
    try {
      await navigator.share({ files: [new File([text], dateiname(), { type: 'text/html' })] });
      datei.name = dateiname(); gesichertMerken();
      kopfNeu();
      toast('Weitergegeben als «' + datei.name + '». Lege die Datei in deinem Ordner ab und ersetze die alte.');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // Teilen-Fenster geschlossen: nichts gesichert
    }
  }
  // 3. Sonst als Download
  const a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'text/html' }));
  a.href = url; a.download = dateiname(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { URL.revokeObjectURL(url); }, 5000);
  datei.name = dateiname(); gesichertMerken();
  kopfNeu();
  toast('Gesichert als «' + datei.name + '» im Ordner «Downloads». Diese Datei enthält alles: zum Weitermachen per Doppelklick öffnen oder im Tool laden.');
}

function fokus(id) { const el = document.getElementById(id); if (el) el.focus(); }
function geaendert(schliessen) { speichern(); if (schliessen) zu(); render(); }
function leuteDazu(text) {
  const t = aktThema(), namen = mehrzeilig(text);
  if (!t || !namen.length) return;
  merken();
  namen.forEach((n) => { t.leute.push({ id: uid(), name: n, gruppe: '' }); });
  geaendert(); fokus('neu-leute');
  if (namen.length > 1) toast(namen.length + ' Namen hinzugefügt', true);

  const min = Math.min.apply(null, zeilen.map((z) => z.ein));

    if (/^ziele( |$)/.test(x) && !gibt('ziele')) return 'ziele';
    if (/^gruppen/.test(x) && !gibt('gruppen')) return 'gruppen';

document.addEventListener('pointerover', (e) => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) tipZeigen(el); else tipWeg(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el) tipZeigen(el); });
document.addEventListener('focusout', tipWeg);
window.addEventListener('scroll', tipWeg, true);
let passT = 0;
window.addEventListener('resize', () => { clearTimeout(passT); passT = setTimeout(diagrammePassen, 120); });

/* Kärtchen der Gruppenzuteilung mit Maus oder Stift ziehen. Mit dem Finger: antippen und Gruppe wählen. */
let zug = null;
function zugEnde() {
  if (!zug) return;
  if (zug.geist) zug.geist.remove();
  if (zug.el) zug.el.classList.remove('zieht');
  $$('.spalte.ziel').forEach((s) => s.classList.remove('ziel'));
  document.body.classList.remove('am-ziehen');
  zug = null;
}
const spalteUnter = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest('[data-spalte]') : null; };
document.addEventListener('pointerdown', (e) => {
  const k = e.target.closest ? e.target.closest('.karte') : null;
  if (!k || e.pointerType === 'touch' || e.button !== 0) return;
  const r = k.getBoundingClientRect();
  zug = { id: k.dataset.id, el: k, x: e.clientX, y: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, b: r.width, geist: null };
});
document.addEventListener('pointermove', (e) => {
  if (!zug) return;
  if (!zug.geist) {
    if (Math.hypot(e.clientX - zug.x, e.clientY - zug.y) < 6) return;
    zug.geist = zug.el.cloneNode(true);
    zug.geist.className = 'karte geist';
    zug.geist.style.width = zug.b + 'px';
    document.body.appendChild(zug.geist);
    zug.el.classList.add('zieht');
    document.body.classList.add('am-ziehen');
  }
  zug.geist.style.transform = 'translate(' + (e.clientX - zug.dx) + 'px,' + (e.clientY - zug.dy) + 'px)';
  const ziel = spalteUnter(e);
  $$('.spalte.ziel').forEach((s) => { if (s !== ziel) s.classList.remove('ziel'); });
  if (ziel) ziel.classList.add('ziel');
});
document.addEventListener('pointerup', (e) => {
  if (!zug) return;
  const gezogen = !!zug.geist, id = zug.id, ziel = gezogen ? spalteUnter(e) : null;
  zugEnde();
  if (!gezogen) return;
  klickSperre = true; setTimeout(() => { klickSperre = false; }, 80);
  const t = aktThema(), p = t && t.leute.find((x) => x.id === id);
  if (!ziel || !p || p.gruppe === ziel.dataset.spalte) return;
  merken();
  p.gruppe = ziel.dataset.spalte;
  geaendert();
});
document.addEventListener('pointercancel', zugEnde);

/* Bildschirmtastatur (iPad, Handy): Sheets richten sich nach dem sichtbaren Teil des Bildschirms */
if (window.visualViewport) {
  const vv = window.visualViewport, wurzel = document.documentElement;
  const sichtbar = () => { wurzel.style.setProperty('--vvh', Math.round(vv.height) + 'px'); wurzel.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px'); };
  vv.addEventListener('resize', sichtbar); vv.addEventListener('scroll', sichtbar);
  sichtbar();
}
/* Android zeigt Dateien aus der Ablage manchmal ohne erkennbaren Typ: dort ohne Filter wählen lassen */
if (ANDROID) ['datei-wahl', 'daten-wahl'].forEach((id) => { const el = document.getElementById(id); if (el) el.removeAttribute('accept'); });
/* Über den Link: Symbol für den Startbildschirm, und die Seite bleibt ohne Netz verfügbar */
if (ALS_LINK) {
  try { const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = 'icon.png'; document.head.appendChild(l); } catch (e) { /* ohne Symbol weiter */ }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* ohne Netz-Vorrat weiter */ }); });
}

render();
})();
</script>
