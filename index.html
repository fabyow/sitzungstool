}
function ziehbar(t) {   // das Element, das sich ziehen lässt, oder nichts
  if (!t || !t.closest || t.closest('input,textarea,select,.sheet-huelle')) return null;
  const k = t.closest('.karte') || t.closest('[data-zieh]') || t.closest('.tliste2 .tlink[data-id]');
  if (!k || k.closest('.tafel.fest') || k.closest('.thema.zu')) return null;
  return k;
}
function zugBeginnen(k, x, y) {
  const r = k.getBoundingClientRect(), art = k.classList.contains('karte') ? 'karte' : (k.classList.contains('tlink') ? 'thema' : k.dataset.zieh);
  zug = { el: k, art: art, id: art === 'karte' || art === 'thema' ? k.dataset.id : k.dataset.zid, x: x, y: y, lx: x, ly: y, dx: x - r.left, dy: y - r.top, b: r.width, geist: null, brett: art === 'thema' ? null : k.closest('[data-brett]') };
}
function geistMachen() {
  const k = zug.el;
  if (zug.art === 'baustellen' || zug.art === 'stichworte') {   // die Zeile braucht ihre Karte um sich, sonst verliert sie ihr Aussehen
    const ul = document.createElement('ul');
    ul.appendChild(k.cloneNode(true));
    zug.geist = document.createElement('div'); zug.geist.className = (zug.art === 'stichworte' ? 'stw' : 'bg') + ' geist'; zug.geist.appendChild(ul);
  } else if (zug.art === 'fdz') {   // Tabellenzeile: als Kärtchen mit dem Inhalt der Zellen
    zug.geist = document.createElement('div'); zug.geist.className = 'fd-geist geist';
    zug.geist.textContent = Array.from(k.children).map((c) => c.textContent.trim()).filter((x) => x && x !== '–').join(' · ');
  } else { zug.geist = k.cloneNode(true); zug.geist.className = (zug.art === 'karte' ? 'karte' : k.className.replace(/\b(hebt|zieht|ein-vor|ein-nach)\b/g, '')) + ' geist'; zug.geist.removeAttribute('style'); }
  zug.geist.style.width = (zug.art === 'fdz' ? Math.min(zug.b, 420) : zug.b) + 'px';
  document.body.appendChild(zug.geist);
  k.classList.remove('hebt');
  k.classList.add('zieht');
  document.body.classList.add('am-ziehen');
}
const vorWem = (nachbarn, wert, quer) => nachbarn.find((n) => { const r = n.getBoundingClientRect(); return quer ? wert < r.left + r.width / 2 : wert < r.top + r.height / 2; }) || null;
function zugZiel(x, y) {   // wohin der Eintrag käme: vor einen Nachbarn («vor») oder hinter den letzten («nach»), dazu die Spalte
  if (zug.art === 'thema') {
    const nav = zug.el.closest('.tliste2');
    if (!nav) return null;
    const quer = getComputedStyle(zug.el.parentNode).display === 'flex', r = nav.getBoundingClientRect();   // schmaler Bildschirm: Themen in einer Zeile
    if (quer ? (y < r.top - 60 || y > r.bottom + 60) : (x < r.left - 80 || x > r.right + 80)) return null;
    const kind = zug.el.classList.contains('kind');
    const nachbarn = $$(kind ? '.tlink.kind[data-id]' : '.tlink[data-id]:not(.kind)', nav).filter((n) => n !== zug.el);
    const vor = vorWem(nachbarn, quer ? x : y, quer);
    return { spalte: null, vor: vor, nach: vor ? null : (nachbarn[nachbarn.length - 1] || null) };
  }
  if (zug.brett) {
    const unter = document.elementFromPoint(x, y), sp = unter && unter.closest ? unter.closest('[data-spalte]') : null;
    if (!sp || !zug.brett.contains(sp)) return null;
    const sel = zug.art === 'karte' ? '.karte' : '[data-zieh="' + zug.art + '"]';
    const nachbarn = $$(sel, sp).filter((n) => n !== zug.el && n.closest('[data-spalte]') === sp);
    const vor = vorWem(nachbarn, y, false);
    return { spalte: sp, vor: vor, nach: vor ? null : (nachbarn[nachbarn.length - 1] || null) };
  }
  const feld = zug.el.parentNode;
  if (!feld || !feld.getBoundingClientRect) return null;
  const r = feld.getBoundingClientRect();
  if (x < r.left - 60 || x > r.right + 60 || y < r.top - 60 || y > r.bottom + 60) return null;
  const nachbarn = Array.from(feld.children).filter((n) => n.dataset && n.dataset.zieh && n !== zug.el);
  const vor = vorWem(nachbarn, y, false);
  return { spalte: null, vor: vor, nach: vor ? null : (nachbarn[nachbarn.length - 1] || null) };
}
function zugMarken() {
  const z = zugZiel(zug.lx, zug.ly);
  $$('.ziel').forEach((s) => { if (!z || s !== z.spalte) s.classList.remove('ziel'); });
  if (z && z.spalte) z.spalte.classList.add('ziel');
  markenWeg();
  if (z && z.vor) z.vor.classList.add('ein-vor'); else if (z && z.nach) z.nach.classList.add('ein-nach');
}
function randRollen() {   // nah am Rand rollt die Seite mit, solange gezogen wird
  cancelAnimationFrame(zugRoll);
  const kopf = document.getElementById('kopf'), oben = (kopf ? kopf.getBoundingClientRect().bottom : 0) + 56, unten = window.innerHeight - 56;
  const v = zug.ly < oben ? -Math.min(18, Math.ceil((oben - zug.ly) / 4)) : (zug.ly > unten ? Math.min(18, Math.ceil((zug.ly - unten) / 4)) : 0);
  if (!v) return;
  const schritt = () => {
    if (!zug || !zug.geist) return;
    const vorher = window.scrollY;
    window.scrollBy(0, v);
    if (window.scrollY === vorher) return;
    zugMarken();
    zugRoll = requestAnimationFrame(schritt);
  };
  zugRoll = requestAnimationFrame(schritt);
}
function zugBewegen(x, y) {
  if (!document.body.contains(zug.el)) { zugEnde(); return; }   // inzwischen neu gezeichnet
  if (!zug.geist) geistMachen();
  zug.lx = x; zug.ly = y;
  zug.geist.style.transform = 'translate(' + (x - zug.dx) + 'px,' + (y - zug.dy) + 'px)';
  zugMarken();
  randRollen();
}
/* Zwischen Ablegen und dem folgenden Klick: der Klick soll nichts öffnen */
let klickT = 0;
function klickSperren(ms) { klickSperre = true; clearTimeout(klickT); klickT = setTimeout(() => { klickSperre = false; }, ms || 80); }
function zugQuelle(art, el) {   // die Liste hinter dem gezogenen Eintrag, dazu das Feld, das die Spalte nennt
  if (art === 'karte') return { liste: S.mitarbeiter, feld: 'polier', setzen: (L) => { S.mitarbeiter = L; } };
  if (art === 'gl') return { liste: S.glPunkte, feld: 'gruppe', setzen: (L) => { S.glPunkte = L; } };
  if (art === 'fdp' || art === 'fdg' || art === 'fdz') {
    const f = feldAus(el), k = art === 'fdz' ? 'zeilen' : 'punkte';
    return f && Array.isArray(f[k]) ? { liste: f[k], feld: art === 'fdg' ? 'spalte' : '', setzen: (L) => { f[k] = L; } } : null;
  }
  const t = aktThema();
  return t && Array.isArray(t[art]) ? { liste: t[art], feld: '', setzen: (L) => { t[art] = L; } } : null;
}
function einreihen(rest, z, kennung) {   // Stelle in der Liste ohne den gezogenen Eintrag
  let i = rest.length;
  if (z.vor) { const n = rest.findIndex((y) => y.id === kennung(z.vor)); if (n >= 0) i = n; }
  else if (z.nach) { const n = rest.findIndex((y) => y.id === kennung(z.nach)); if (n >= 0) i = n + 1; }
  return i;
}
function themaFallen(id, z) {   // Thema innerhalb der Themen, Unterpunkt innerhalb seines Themas; Unterpunkte wandern mit
  const T = S.themen, x0 = T.find((t) => t.id === id);
  if (!x0) return;
  const kennung = (n) => (n ? n.dataset.id : ''), geschw = x0.eltern ? T.filter((t) => t.eltern === x0.eltern) : T.filter((t) => !t.eltern), rest = geschw.filter((t) => t !== x0);
  rest.splice(einreihen(rest, z, kennung), 0, x0);
  if (rest.every((t, n) => t === geschw[n])) return;
  merken();
  if (x0.eltern) { let k = 0; S.themen = T.map((t) => (t.eltern === x0.eltern ? rest[k++] : t)); }
  else S.themen = ordnen(rest.concat(T.filter((t) => t.eltern)));
  geaendert();
}
function zugFallen(x, y, finger) {
  const gezogen = !!zug.geist, art = zug.art, id = zug.id, el = zug.el;
  zug.lx = x; zug.ly = y;
  const z = gezogen ? zugZiel(x, y) : null;
  zugEnde();
  if (!gezogen) return;
  klickSperren(finger ? 150 : 80);
  if (!z) return;
  if (art === 'thema') { themaFallen(id, z); return; }
  const q = zugQuelle(art, el);
  if (!q) return;
  const liste = q.liste, x0 = liste.find((y2) => y2.id === id);
  if (!x0) return;
  const kennung = (n) => (n ? (art === 'karte' ? n.dataset.id : n.dataset.zid) : ''), rest = liste.filter((y2) => y2 !== x0);
  rest.splice(einreihen(rest, z, kennung), 0, x0);
  const neuSp = q.feld && z.spalte ? z.spalte.dataset.spalte || '' : null, vorher = q.feld ? x0[q.feld] || '' : null;
  if ((neuSp === null || neuSp === vorher) && rest.every((y2, n) => y2 === liste[n])) return;   // am alten Platz losgelassen
  merken();
  if (neuSp !== null) x0[q.feld] = neuSp;
  q.setzen(rest);
  geaendert();
}
/* Maus und Stift */
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' || e.button !== 0 || zug) return;
  const k = ziehbar(e.target);
  if (k) zugBeginnen(k, e.clientX, e.clientY);
});
document.addEventListener('pointermove', (e) => {
  if (!zug || zug.finger !== undefined) return;
  if (!zug.geist && Math.hypot(e.clientX - zug.x, e.clientY - zug.y) < 6) return;
  zugBewegen(e.clientX, e.clientY);
});
document.addEventListener('pointerup', (e) => { if (zug && zug.finger === undefined) zugFallen(e.clientX, e.clientY, false); });
document.addEventListener('pointercancel', () => { if (zug && zug.finger === undefined) zugEnde(); });
/* Finger: kurz drücken, bis sich der Eintrag anhebt, dann schieben */
document.addEventListener('touchstart', (e) => {
  if (zug || e.touches.length !== 1) { if (zug && zug.finger !== undefined && !zug.geist) zugEnde(); return; }
  const k = ziehbar(e.target);
  if (!k) return;
  const t0 = e.touches[0];
  zugBeginnen(k, t0.clientX, t0.clientY);
  zug.finger = t0.identifier;
  zug.halten = setTimeout(() => { if (!zug || zug.el !== k) return; zug.bereit = true; k.classList.add('hebt'); try { if (navigator.vibrate) navigator.vibrate(10); } catch (x) { /* ohne Rütteln */ } }, HALTEN_MS);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!zug || zug.finger === undefined) return;
  const t0 = Array.prototype.find.call(e.touches, (t) => t.identifier === zug.finger);
  if (!t0) return;
  if (!zug.bereit) { if (Math.hypot(t0.clientX - zug.x, t0.clientY - zug.y) > 10) zugEnde(); return; }   // vor dem Anheben bewegt: die Seite rollt
  if (e.cancelable) e.preventDefault();
  zugBewegen(t0.clientX, t0.clientY);
}, { passive: false });
document.addEventListener('touchend', (e) => {
  if (!zug || zug.finger === undefined) return;
  if (!zug.bereit) { zugEnde(); return; }   // kurz getippt: der Klick folgt wie bisher
  if (e.cancelable) e.preventDefault();   // nach dem Anheben kein Klick

  if (!zug.geist) { zugEnde(); klickSperren(150); return; }   // angehoben, aber nicht geschoben
  zugFallen(t0 ? t0.clientX : zug.lx, t0 ? t0.clientY : zug.ly, true);
}, { passive: false });
document.addEventListener('touchcancel', () => { if (zug && zug.finger !== undefined) zugEnde(); });
document.addEventListener('contextmenu', (e) => { if (zug && zug.finger !== undefined) e.preventDefault(); });   // langes Drücken: kein Menü des Browsers

/* Bildschirmtastatur (iPad, Handy): Sheets richten sich nach dem sichtbaren Teil des Bildschirms */
if (window.visualViewport) {
  const vv = window.visualViewport, wurzel = document.documentElement;
  const sichtbar = () => { wurzel.style.setProperty('--vvh', Math.round(vv.height) + 'px'); wurzel.style.setProperty('--vvt', Math.round(vv.offsetTop) + 'px'); };
  vv.addEventListener('resize', sichtbar); vv.addEventListener('scroll', sichtbar);
  sichtbar();
}
/* Android zeigt Dateien aus der Ablage manchmal ohne erkennbaren Typ: dort ohne Filter wählen lassen */
if (ANDROID) ['datei-wahl', 'daten-wahl'].forEach((id) => { const el = document.getElementById(id); if (el) el.removeAttribute('accept'); });
/* Über den Link: Symbol für den Startbildschirm, und die Seite bleibt ohne Netz verfügbar */
if (ALS_LINK) {
  try { const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = 'icon.png'; document.head.appendChild(l); } catch (e) { /* ohne Symbol weiter */ }

}

document.addEventListener('input', (e) => {   // Suche in der Kunden-Tabelle (247.2); Vorrechnen (242.5) rechnet beim Tippen neu
  const el = e.target, vf = el && el.closest ? el.closest('form[data-form="vorrechnen"]') : null;
